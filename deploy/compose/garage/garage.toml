# Single-node Garage for local development: the S3 storage driver is tested
# against it (docs/adr/0009-file-storage.md). Not a production layout:
# replication_factor = 1 keeps one copy of every object.
# rpc_secret comes from GARAGE_RPC_SECRET (deploy/compose/.env.example).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

# Go server code generated from api/openapi.yaml by `make gen`. The output is
# never edited by hand (docs/00 §8).
package: oapi
output: internal/api/oapi/oapi.gen.go
generate:
  models: true
  chi-server: true
output-options:
  # Signed file links (internal/api/files.go) are served by hand: the key is
  # a multi-segment path and the routes exist only with the fs driver.
  # Conversations and contacts (internal/api/conversations.go) are routed by
  # hand because generated parameter binding imports
  # github.com/oapi-codegen/runtime, a dependency awaiting the owner's
  # approval (docs/00 §16). Their models are still generated.
  # The public waitlist has its own route group and package
  # (oapi-codegen.waitlist.yaml).
  exclude-tags: [files, conversations, contacts, waitlist]
  # Keep schemas used only by the hand-routed operations.
  skip-prune: true

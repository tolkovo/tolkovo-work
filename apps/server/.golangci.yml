version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    depguard:
      rules:
        # platform/ is infrastructure and must not know business modules
        # (docs/00 §6.1). New modules are added to this list.
        platform-is-infrastructure:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/tenancy
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/auth
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/conversations
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/notifications
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/channels
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/ingest
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/integrations
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/widget
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/routing
              desc: platform must not import business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/realtime
              desc: platform must not import the realtime transport
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/api
              desc: platform must not import the HTTP layer
        # realtime is the WebSocket transport (ADR-0005): it speaks net/http
        # like api, but knows events only as outbox rows. Authentication
        # comes from api as a realtime.Client, so it needs no business module.
        realtime-is-transport:
          files: ["**/internal/realtime/**", "!$test"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/api
              desc: api imports realtime, not the other way round
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/tenancy
              desc: realtime gets the caller from api as realtime.Client
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/auth
              desc: realtime gets the caller from api as realtime.Client
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/conversations
              desc: realtime relays outbox events, it does not call business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/notifications
              desc: realtime relays outbox events, it does not call business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/channels
              desc: realtime relays outbox events, it does not call business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/ingest
              desc: realtime relays outbox events, it does not call business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/integrations
              desc: realtime relays outbox events, it does not call business modules
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/widget
              desc: realtime gets the visitor from api as realtime.Visitor
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/routing
              desc: realtime reports open panels through Options.OnPresence
        # Business modules do not know about HTTP.
        modules-without-http:
          files: ["**/internal/tenancy/**", "**/internal/auth/**", "**/internal/conversations/**", "**/internal/notifications/**", "**/internal/ingest/**", "**/internal/widget/**", "**/internal/routing/**"]
          deny:
            - pkg: net/http
              desc: HTTP lives in internal/api
            - pkg: github.com/go-chi/chi/v5
              desc: HTTP lives in internal/api
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/api
              desc: modules must not import the HTTP layer
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/realtime
              desc: modules publish through the outbox, not to the realtime transport
            - pkg: github.com/coder/websocket
              desc: WebSocket lives in internal/realtime
        # channels talks to Telegram over HTTP and MTProto, integrations to
        # GitHub (their adapters are clients), but serving HTTP stays in
        # internal/api.
        channels-without-http-layer:
          files: ["**/internal/channels/**", "**/internal/integrations/**"]
          deny:
            - pkg: github.com/go-chi/chi/v5
              desc: HTTP routes live in internal/api
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/api
              desc: modules must not import the HTTP layer
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/realtime
              desc: modules publish through the outbox, not to the realtime transport
            - pkg: github.com/coder/websocket
              desc: WebSocket lives in internal/realtime
        # Another module's generated store is private to it.
        no-foreign-store:
          files: ["!**/internal/tenancy/**", "$all"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/tenancy/store
              desc: use the tenancy facade, not its store
        no-foreign-conversations-store:
          files: ["!**/internal/conversations/**", "$all"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/conversations/store
              desc: use the conversations facade, not its store
        no-foreign-notifications-store:
          files: ["!**/internal/notifications/**", "$all"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/notifications/store
              desc: use the notifications facade, not its store
        no-foreign-channels-store:
          files: ["!**/internal/channels/**", "$all"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/channels/store
              desc: use the channels facade, not its store
        no-foreign-integrations-store:
          files: ["!**/internal/integrations/**", "$all"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/integrations/store
              desc: use the integrations facade, not its store
        no-foreign-ingest-store:
          files: ["!**/internal/ingest/**", "$all"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/ingest/store
              desc: use the ingest facade, not its store
        no-foreign-routing-store:
          files: ["!**/internal/routing/**", "$all"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/routing/store
              desc: use the routing facade, not its store
        no-foreign-widget-store:
          files: ["!**/internal/widget/**", "$all"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/widget/store
              desc: use the widget facade, not its store
        # The widget's visitors write through channels and conversations;
        # neither knows the widget module.
        widget-is-a-leaf:
          files: ["**/internal/channels/**", "**/internal/conversations/**"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/widget
              desc: widget calls channels and conversations, not the other way round
        # Reports flow from ingest into channels (keys) and, in AP-03,
        # conversations; neither knows ingest.
        ingest-is-a-leaf:
          files: ["**/internal/channels/**", "**/internal/conversations/**"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/ingest
              desc: ingest calls channels and conversations, not the other way round
        # Inbound messages flow from channels into conversations (T-02), never back.
        conversations-without-channels:
          files: ["**/internal/conversations/**"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/channels
              desc: channels calls conversations, not the other way round
        # integrations records issues in conversations (GH-02) through its
        # facade; conversations does not know about trackers.
        conversations-without-integrations:
          files: ["**/internal/conversations/**"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/integrations
              desc: integrations calls conversations, not the other way round
        # notifications reads conversations; conversations only knows its
        # Notifier interface.
        conversations-without-notifications:
          files: ["**/internal/conversations/**"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/notifications
              desc: conversations calls notifications through conversations.Notifier
        # routing assigns through the conversations facade; conversations
        # only knows its Router interface.
        conversations-without-routing:
          files: ["**/internal/conversations/**"]
          deny:
            - pkg: github.com/tolkovo/tolkovo/apps/server/internal/routing
              desc: conversations calls routing through conversations.Router
    forbidigo:
      analyze-types: true
      forbid:
        # The raw pool skips InTenantTx and RLS context (docs/00 §6.4).
        - pattern: ^db\.DB\.Pool$
          pkg: ^github\.com/tolkovo/tolkovo/apps/server/internal/platform/db$
          msg: business code uses db.InTenantTx or db.InGlobalTx, not the raw pool
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    generated: strict
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      - path: (internal/platform/|cmd/)
        linters: [forbidigo]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/tolkovo/tolkovo]

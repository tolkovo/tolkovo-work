version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/tenancy/queries
    gen:
      go:
        package: store
        out: internal/tenancy/store
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: citext
            go_type: string
  - engine: postgresql
    schema: migrations
    queries: internal/platform/outbox/queries
    gen:
      go:
        package: store
        out: internal/platform/outbox/store
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides: *overrides

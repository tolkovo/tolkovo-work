version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/tenancy/queries
    gen:
      go:
        package: store
        out: internal/tenancy/store
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: citext
            go_type: string
  - engine: postgresql
    schema: migrations
    queries: internal/conversations/queries
    gen:
      go:
        package: store
        out: internal/conversations/store
        sql_package: pgx/v5
        omit_unused_structs: true
        # The shared overrides plus pointers for nullable uuid and text.
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/notifications/queries
    gen:
      go:
        package: store
        out: internal/notifications/store
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/channels/queries
    gen:
      go:
        package: store
        out: internal/channels/store
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/ingest/queries
    gen:
      go:
        package: store
        out: internal/ingest/store
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/platform/outbox/queries
    gen:
      go:
        package: store
        out: internal/platform/outbox/store
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides: *overrides

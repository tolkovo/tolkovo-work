# The public waitlist API (tag "waitlist" in api/openapi.yaml), generated by
# `make gen` into its own package: it is mounted in a separate route group
# with CORS for the landing and without the session, Origin and CSRF checks
# of the panel API (docs/02 §13.1). Never edited by hand (docs/00 §8).
package: waitlistapi
output: internal/api/waitlistapi/waitlistapi.gen.go
generate:
  models: true
  chi-server: true
output-options:
  include-tags: [waitlist]

openapi: 3.1.0
info:
  title: Tolkovo API
  version: 0.1.0
  description: |
    The single source of truth for the Tolkovo REST API (docs/00 §8, docs/02 §12).
    Server code is generated from this file (`make gen`); never edit the generated code.

    ## Authentication

    The panel authenticates with an opaque session token in an `HttpOnly`,
    `SameSite=Lax` cookie. The cookie is `Secure` outside development and is then
    named `__Host-tolkovo_session`; in development it is `tolkovo_session`.
    Sessions live on the server (Redis): logout and workspace switching revoke them
    immediately.

    The workspace of a request always comes from the session, never from the body or
    the URL. A resource of another workspace answers `404`, a missing permission in
    your own workspace answers `403`.

    ## CSRF

    Every unsafe request (`POST`, `PUT`, `PATCH`, `DELETE`) authenticated by the cookie
    must send the session's CSRF token in the `X-CSRF-Token` header. The token is
    returned in `csrf_token` of every `Session` response (register, login, workspace
    switch, `GET /me`) and changes with the session. Unsafe requests with an `Origin`
    header from another origin are rejected, including login and registration.

    ## Errors

    Errors are RFC 9457 `application/problem+json` documents with a stable `code`.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: workspace
  - name: files
    description: |
      Signed upload and download links of the `fs` storage driver
      (docs/adr/0009-file-storage.md). Mounted only with `TOLKOVO_STORAGE_DRIVER=fs`;
      with `s3` the links point at the bucket. Authorised by the link signature, not
      by the session. Served by hand (`internal/api/files.go`), not generated.
  - name: waitlist
    description: |
      Public waitlist of the landing with double opt-in (docs/05 §6). Mounted only with
      `TOLKOVO_WAITLIST_ENABLED=true`. No session and no CSRF token: the landing calls
      it from another origin, so the routes live in their own group with CORS for
      `TOLKOVO_WAITLIST_ORIGINS` only (no credentials) and rate limits per client IP
      and per email. Generated into a separate package (`internal/api/waitlistapi`).

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and its first workspace
      description: |
        Creates the user, the workspace and the owner membership atomically, then
        starts a session in that workspace. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered and signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`email_taken` or `slug_taken`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Always starts a new session (any session cookie sent along is revoked) in the
        user's first workspace; switch with `POST /auth/workspace`. The answer for an
        unknown email, a wrong password and a disabled account is the same
        `invalid_credentials`. Rate limited per email and client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/workspace:
    post:
      tags: [auth]
      operationId: switchWorkspace
      summary: Switch the session to another workspace of the user
      description: |
        Requires an active membership in the target workspace, otherwise `404`.
        The old session is revoked and a new one (new cookie, new CSRF token) is issued.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchWorkspaceRequest' }
      responses:
        '200':
          description: Switched.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user, workspace, role and permissions
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/workspaces:
    get:
      tags: [auth]
      operationId: listMyWorkspaces
      summary: Workspaces the current user is an active member of
      responses:
        '200':
          description: The user's workspaces, oldest membership first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /workspace:
    patch:
      tags: [workspace]
      operationId: updateWorkspace
      summary: Change settings of the current workspace
      description: Requires `workspace.manage` (owner, admin).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' }
      responses:
        '200':
          description: The updated workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members:
    get:
      tags: [workspace]
      operationId: listMembers
      summary: Members of the current workspace
      description: Requires `members.view` (owner, admin, operator).
      responses:
        '200':
          description: Members of the current workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /files/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: |
          Object key `ws/{workspace_id}/{kind}/{uuid}`. It spans several path
          segments: the slashes are sent unescaped.
        schema: { type: string }
      - name: exp
        in: query
        required: true
        description: Expiry of the link, Unix seconds.
        schema: { type: integer, format: int64 }
      - name: sig
        in: query
        required: true
        description: HMAC signature over the method, the key and every other query parameter.
        schema: { type: string }
    get:
      tags: [files]
      operationId: downloadFile
      summary: Download a file by a signed link
      security: []
      parameters:
        - name: type
          in: query
          description: Content type to answer with; `application/octet-stream` when absent.
          schema: { type: string }
        - name: name
          in: query
          description: File name for `Content-Disposition`.
          schema: { type: string }
      responses:
        '200':
          description: |
            The file, always as an attachment (`Content-Disposition`, `nosniff`, sandbox CSP,
            `Cache-Control: private, no-store`). Range and conditional requests are supported.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content for a `Range` request.
        '403': { $ref: '#/components/responses/LinkRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [files]
      operationId: uploadFile
      summary: Upload a file by a signed link
      description: |
        The link decides the key, the size limits, the digest and the content type; the
        request only supplies the bytes. Each upload link works once.
      security: []
      parameters:
        - name: max
          in: query
          required: true
          description: Largest accepted body, bytes.
          schema: { type: integer, format: int64 }
        - name: size
          in: query
          description: Exact body size, bytes, when the link fixes it.
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          description: Required `Content-Type` of the request when present.
          schema: { type: string }
        - name: sha256
          in: query
          description: Hex SHA-256 the body must match when present.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored (an empty body, as S3 answers a PUT).
        '400':
          description: '`size_mismatch` or `checksum_mismatch`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/LinkRejected' }
        '408':
          description: '`upload_timeout`: the client was too slow; nothing was stored.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`already_uploaded`: the link has been used.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: '`file_too_large`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: '`content_type_mismatch`: `Content-Type` differs from the link.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /waitlist:
    post:
      tags: [waitlist]
      operationId: joinWaitlist
      summary: Ask to join the waitlist; a confirmation email follows
      description: |
        Saves the address as pending and queues an email with a confirmation link to the
        landing (`/waitlist/confirm/#<token>`, `/en/...` for `en`); the page posts the token
        to `POST /waitlist/confirm`. Until then the address is not on the list, and pending
        entries are deleted after `TOLKOVO_WAITLIST_PENDING_RETENTION`.

        The answer is the same `202` for a new, a pending and a confirmed address, so the
        endpoint does not reveal who is on the list. A confirmed entry is not changed and gets
        no email; a pending one takes the new answers and gets a new email, at most five per
        address. Repeating the request is safe, so an `Idempotency-Key` header (docs/00 §8)
        is allowed by CORS and ignored. Rate limited per client IP and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitlistJoinRequest' }
      responses:
        '202':
          description: Accepted; check the inbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistAccepted' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403':
          description: '`cross_origin`: the `Origin` is not in `TOLKOVO_WAITLIST_ORIGINS`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /waitlist/confirm:
    post:
      tags: [waitlist]
      operationId: confirmWaitlist
      summary: Confirm the address with the token from the email
      description: |
        The email links to a landing page instead of this endpoint, because mail scanners
        open links: only a person pressing the button there confirms. Confirming again with
        the same link while it is valid answers `200` again. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitlistTokenRequest' }
      responses:
        '200':
          description: The address is on the list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistConfirmed' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403':
          description: '`cross_origin`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/TokenInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /waitlist/unsubscribe:
    post:
      tags: [waitlist]
      operationId: unsubscribeWaitlist
      summary: Delete the address from the waitlist
      description: |
        Deletes the entry, pending or confirmed (GDPR art. 17). The token comes from the
        latest email sent to the address. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitlistTokenRequest' }
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/Invalid' }
        '403':
          description: '`cross_origin`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/TokenInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tolkovo_session
      description: '`__Host-tolkovo_session` outside development.'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: '`csrf_token` of the current session. Required on every unsafe method.'

  headers:
    SetSessionCookie:
      description: The session cookie (`HttpOnly; SameSite=Lax; Path=/`, `Secure` outside development).
      schema: { type: string }

  responses:
    Invalid:
      description: '`invalid_request`: malformed JSON, unknown fields or invalid values.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: '`unauthenticated` (no or expired session) or `invalid_credentials` (login).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden` (missing permission), `csrf_failed`, `cross_origin` or `no_workspace`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`not_found`, also for resources of other workspaces.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TokenInvalid:
      description: '`token_invalid`: unknown, expired or already used link.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkRejected:
      description: '`link_invalid` (bad signature or parameters) or `link_expired`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`too_many_requests`; see `Retry-After`.'
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Stable machine-readable error code. }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }

    Locale:
      type: string
      enum: [ru, en]

    Role:
      type: string
      description: System role in phase 1 (docs/04 §4.2).
      enum: [owner, admin, operator]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name, workspace_name, workspace_slug]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: '#/components/schemas/Locale' }
        workspace_name: { type: string, minLength: 1, maxLength: 120 }
        workspace_slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
        timezone:
          type: string
          description: IANA time zone; defaults to Europe/Moscow.
          maxLength: 64

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }

    SwitchWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }

    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: '#/components/schemas/Locale' }
        timezone: { type: string, maxLength: 64 }

    User:
      type: object
      required: [id, email, name, locale]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        email: { type: string }
        name: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }

    Workspace:
      type: object
      required: [id, slug, name, locale, timezone]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        slug: { type: string }
        name: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        timezone: { type: string }

    WorkspaceSummary:
      type: object
      required: [id, slug, name, role]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceSummary' }

    Session:
      type: object
      required: [user, workspace, role, permissions, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        workspace: { $ref: '#/components/schemas/Workspace' }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          description: Permissions of the role in this workspace, sorted (docs/04 §4.1).
          items: { type: string }
        csrf_token:
          type: string
          description: Send it as `X-CSRF-Token` on unsafe requests.

    Member:
      type: object
      required: [user_id, email, name, role, active]
      properties:
        user_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }

    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }

    WaitlistChannel:
      type: string
      description: Channels the person wants, for prioritising the roadmap (docs/05 §1).
      enum: [telegram, web, whatsapp, vk_max, email]

    WaitlistJoinRequest:
      type: object
      additionalProperties: false
      required: [email, locale, consent]
      properties:
        email: { type: string, maxLength: 254 }
        locale:
          $ref: '#/components/schemas/Locale'
        consent:
          type: boolean
          description: |
            Explicit consent to processing the email and channels for the beta invitation
            (GDPR art. 7). Must be `true`; the server stores the version of the consent text.
        channels:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/WaitlistChannel' }
        website:
          type: string
          maxLength: 200
          description: |
            Honeypot: hidden from people, filled by bots. A non-empty value gets the usual
            `202` and nothing is saved.

    WaitlistTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Token from the link in the email (43 characters, base64url).
          maxLength: 64

    WaitlistAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending_confirmation]

    WaitlistConfirmed:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed]

openapi: 3.1.0
info:
  title: Tolkovo API
  version: 0.1.0
  description: |
    The single source of truth for the Tolkovo REST API (docs/00 §8, docs/02 §12).
    Server code is generated from this file (`make gen`); never edit the generated code.

    ## Authentication

    The panel authenticates with an opaque session token in an `HttpOnly`,
    `SameSite=Lax` cookie. The cookie is `Secure` outside development and is then
    named `__Host-tolkovo_session`; in development it is `tolkovo_session`.
    Sessions live on the server (Redis): logout, workspace switching, a password change
    and `/me/sessions` revoke them immediately.

    The workspace of a request always comes from the session, never from the body or
    the URL. A resource of another workspace answers `404`, a missing permission in
    your own workspace answers `403`.

    ## CSRF

    Every unsafe request (`POST`, `PUT`, `PATCH`, `DELETE`) authenticated by the cookie
    must send the session's CSRF token in the `X-CSRF-Token` header. The token is
    returned in `csrf_token` of every `Session` response (register, login, workspace
    switch, `GET /me`) and changes with the session. Unsafe requests with an `Origin`
    header from another origin are rejected, including login and registration.

    ## Errors

    Errors are RFC 9457 `application/problem+json` documents with a stable `code`.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: workspace
  - name: files
    description: |
      Signed upload and download links of the `fs` storage driver
      (docs/adr/0009-file-storage.md). Mounted only with `TOLKOVO_STORAGE_DRIVER=fs`;
      with `s3` the links point at the bucket. Authorised by the link signature, not
      by the session. Served by hand (`internal/api/files.go`), not generated.
  - name: conversations
    description: |
      Conversations, their messages and attachments (docs/02 §7–8). Status changes
      follow the state machine of docs/02 §8; a forbidden transition answers `409
      invalid_transition`. Operators reply in and change only conversations assigned to
      them; `conversations.manage` (owner, admin) lifts that limit.
  - name: contacts
    description: Customers. Email and phone are personal data.
  - name: channels
    description: |
      Where customers write from (docs/02 §11, ADR-0014): a Telegram bot connected by its
      token, or a personal Telegram account signed in by phone over MTProto. Secrets (the
      token, the account session) are encrypted and never returned. Requires
      `channels.view` to read and `channels.manage` to change (owner, admin).
  - name: ingest
    description: |
      Problem reports from company apps (docs/02 §11.6). Authenticated by an ingest key of
      an app channel in `Authorization: Bearer tk_ingest_…`, not by a session; call these
      from the app's main process or backend (no CORS yet). The key only creates
      reports. Create the report, upload every file with exactly the returned method, URL
      and headers, then complete it. Rates: 10 reports a minute per IP and 60 an hour per
      key; the channel's daily quota of reports and megabytes. Errors carry a `code`;
      `429` carries `Retry-After`.

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and its first workspace
      description: |
        Creates the user, the workspace and the owner membership atomically, then
        starts a session in that workspace. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered and signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`email_taken` or `slug_taken`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Always starts a new session (any session cookie sent along is revoked) in the
        user's first workspace; switch with `POST /auth/workspace`. The answer for an
        unknown email, a wrong password and a disabled account is the same
        `invalid_credentials`. Rate limited per email and client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/workspace:
    post:
      tags: [auth]
      operationId: switchWorkspace
      summary: Switch the session to another workspace of the user
      description: |
        Requires an active membership in the target workspace, otherwise `404`.
        The old session is revoked and a new one (new cookie, new CSRF token) is issued.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchWorkspaceRequest' }
      responses:
        '200':
          description: Switched.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/invitation/preview:
    post:
      tags: [auth]
      operationId: previewInvitation
      summary: Show an invitation before accepting it
      description: |
        `token` is the fragment of the invitation link. An unknown, revoked, accepted or
        expired invitation answers `422 invalid_token`. `account_exists` tells the panel
        whether to ask for a password only or for a name and a new password. Rate limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/invitation/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Accept an invitation and sign in to its workspace
      description: |
        Without an account for the invited email, `name` and `password` (8–128 characters)
        create one; its email counts as confirmed. With an account, `password` must be the
        account's password (`401 invalid_credentials` otherwise) and `name` is ignored. A
        deactivated member is reactivated with the invited role; an active member answers
        `409 already_member`. Starts a session in the invitation's workspace, as login does.
        Rate limited per client IP and email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: Accepted and signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`already_member`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: |
        Answers `202` whether or not the email belongs to an account, so the answer does
        not reveal registered addresses. The link works for 1 hour and only the latest one
        works. Without outgoing email configured (`TOLKOVO_SMTP_HOST`) answers `503
        email_disabled`. Rate limited per client IP and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202':
          description: If the account exists, the email is on its way.
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/EmailDisabled' }

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password by a reset link
      description: |
        `token` is the fragment of the reset link; it works once. Sets the password,
        confirms the email (the link reached it) and revokes every session of the user.
        Does not sign in. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: The password is changed; sign in with it.
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm the email address by a link
      description: |
        `token` is the fragment of the confirmation link sent after registration; it works
        once, for 48 hours. Needs no session: the link may be opened in another browser.
        Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204':
          description: The email is confirmed.
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user, workspace, role and permissions
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Change the current user's profile
      description: |
        Name and interface language of the account. They belong to the user, not to the
        workspace, so they apply in every workspace of the user. Absent fields stay as they
        are; the name is trimmed. Needs a session only, no permission.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The current session with the changed user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/email/verification:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: Send the email confirmation link again
      description: |
        A new link replaces the previous one. An already confirmed email answers `409
        email_verified`. Rate limited per user.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: The email is on its way.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`email_verified`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/EmailDisabled' }

  /me/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the current user's password
      description: |
        Checks `current_password`; the new one follows the registration policy (8–128
        characters). A wrong current password answers `422 wrong_password`. Attempts are
        rate limited per user, counted before the check.

        On success every other session of the user (all devices, all workspaces) is revoked
        and the current one is replaced: a new cookie and a new `csrf_token`, as on login.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Changed; the new session.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`wrong_password`: `current_password` does not match.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: Active sessions (signed-in devices) of the current user
      description: |
        Every live session of the user across workspaces, the current one first, then by
        last activity. IP addresses are not stored.
      responses:
        '200':
          description: The user's sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSessionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/sessions/revoke-others:
    post:
      tags: [auth]
      operationId: revokeOtherSessions
      summary: Sign out on every other device
      description: Revokes every session of the user except the current one.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Other sessions revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: End one session of the current user
      description: |
        `id` is the `id` of a `DeviceSession`. A session of another user, an expired one
        and an unknown id answer `404`. The current session answers `409 current_session`:
        sign out with `POST /auth/logout` instead.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: The session is revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`current_session`: use `POST /auth/logout` to end the current session.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/notifications:
    get:
      tags: [auth]
      operationId: getMyNotificationSettings
      summary: The current user's notification settings in this workspace
      description: |
        What the server does for the user: the email about customer messages left unread in
        their conversations. Sounds and desktop notifications are settings of a browser and
        are not stored here (docs/04 §5.5).
      responses:
        '200':
          description: The settings; defaults until the user changes them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [auth]
      operationId: updateMyNotificationSettings
      summary: Change the current user's notification settings in this workspace
      description: Absent fields stay as they are. Needs a session only, no permission.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationSettingsRequest' }
      responses:
        '200':
          description: The changed settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/workspaces:
    get:
      tags: [auth]
      operationId: listMyWorkspaces
      summary: Workspaces the current user is an active member of
      responses:
        '200':
          description: The user's workspaces, oldest membership first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /workspace:
    patch:
      tags: [workspace]
      operationId: updateWorkspace
      summary: Change settings of the current workspace
      description: Requires `workspace.manage` (owner, admin).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' }
      responses:
        '200':
          description: The updated workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members:
    get:
      tags: [workspace]
      operationId: listMembers
      summary: Members of the current workspace
      description: Requires `members.view` (owner, admin, operator).
      responses:
        '200':
          description: Members of the current workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invitations:
    get:
      tags: [workspace]
      operationId: listInvitations
      summary: Open invitations of the current workspace
      description: |
        Invitations that are neither accepted nor revoked, newest first; expired ones are
        included with `expired: true` so they can be resent. Requires `members.manage`.
      responses:
        '200':
          description: Open invitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [workspace]
      operationId: createInvitation
      summary: Invite a person by email
      description: |
        Grants `admin` or `operator` (never `owner`). An open invitation to the same
        address is replaced. An active member answers `409 already_member`. The link works
        for 7 days.

        With outgoing email configured the link is emailed and `invite_url` is absent.
        Without it nothing is sent and `invite_url` holds the link for the admin to pass
        on. Requires `members.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: The invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationSent' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`already_member`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /invitations/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [workspace]
      operationId: resendInvitation
      summary: Issue a new link for an open invitation
      description: |
        The previous link stops working and the invitation is valid for another 7 days,
        also when it had expired. Emailed, or returned in `invite_url`, as on creation.
        Requires `members.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The invitation with its new expiry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationSent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [workspace]
      operationId: revokeInvitation
      summary: Revoke an open invitation
      description: Its link stops working. Requires `members.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: Channels of the current workspace
      description: |
        Connected channels and personal-account logins in progress (`pending`), oldest
        first. Requires `channels.view`.
      responses:
        '200':
          description: The channels and what can be connected on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /channels/telegram-bot:
    post:
      tags: [channels]
      operationId: connectTelegramBot
      summary: Connect a Telegram bot by its token
      description: |
        `getMe` checks the token; then the bot's updates are pointed at this server — a
        webhook when `TOLKOVO_PUBLIC_URL` is https on a port Telegram accepts, otherwise
        polling by the worker (`details.delivery`). The bot's name is used when `name` is
        absent. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectTelegramBotRequest' }
      responses:
        '201':
          description: The active channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ChannelExists' }
        '422':
          description: '`telegram_token_invalid`: Telegram does not know the token.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/TelegramUnavailable' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/telegram-user:
    post:
      tags: [channels]
      operationId: startTelegramUserLogin
      summary: Start connecting a personal Telegram account
      description: |
        Telegram sends a login code to the account (`code_via`: usually the Telegram app,
        sometimes SMS or a call). The channel stays `pending` until the code — and the
        cloud password, if the account has one — is entered, at most 15 minutes. Only
        one-to-one chats with people reach the inbox, only messages after the connection
        (ADR-0014). Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartTelegramUserLoginRequest' }
      responses:
        '201':
          description: The pending login, waiting for the code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLogin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TelegramLoginRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/TelegramUnavailable' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/telegram-user/code:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [channels]
      operationId: submitTelegramUserCode
      summary: Enter the login code of a personal account
      description: |
        `next: done` — the channel is active; `next: password` — the account has a cloud
        password. A wrong code (`telegram_code_invalid`) may be entered again. Requires
        `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramCodeRequest' }
      responses:
        '200':
          description: The login after the code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLogin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LoginStep' }
        '422': { $ref: '#/components/responses/TelegramLoginRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/TelegramUnavailable' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/telegram-user/password:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [channels]
      operationId: submitTelegramUserPassword
      summary: Enter the cloud password of a personal account
      description: |
        Used once for Telegram's SRP proof and never stored. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramPasswordRequest' }
      responses:
        '200':
          description: The finished login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLogin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LoginStep' }
        '422': { $ref: '#/components/responses/TelegramLoginRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/TelegramUnavailable' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [channels]
      operationId: renameChannel
      summary: Rename a channel in the panel
      description: The name customers see in Telegram does not change. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameChannelRequest' }
      responses:
        '200':
          description: The renamed channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [channels]
      operationId: disconnectChannel
      summary: Disconnect a channel
      description: |
        A bot stops sending updates here (`deleteWebhook`); a personal account's session is
        ended in Telegram (`auth.logOut`) and disappears from its devices. Telegram's answer
        does not block the removal. The secret is deleted; conversations of the channel
        stay. A login in progress is cancelled. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Disconnected.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /channels/app:
    post:
      tags: [channels]
      operationId: connectAppChannel
      summary: Connect a company app that sends problem reports
      description: |
        Creates the «Приложение» channel (docs/02 §11.6) with its first ingest key and the
        secret that signs the app user's identity. Both are returned only here: the server
        keeps the key's hash and the secret sealed. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectAppChannelRequest' }
      responses:
        '201':
          description: The active channel, its first key and the identity secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppChannelCreated' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/ingest-keys:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [channels]
      operationId: listIngestKeys
      summary: Ingest keys of an app channel
      description: Newest first, revoked ones included. Never the keys themselves. Requires `channels.view`.
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestKeyList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [channels]
      operationId: createIngestKey
      summary: Issue one more ingest key
      description: |
        For a new build of the app, or to replace a leaked key without stopping the old
        builds at once. Up to 20 keys that are not revoked. The key is returned only here.
        Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIngestKeyRequest' }
      responses:
        '201':
          description: The key, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestKeyCreated' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`too_many_keys`: 20 keys are in use; revoke one first.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /channels/{id}/ingest-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/KeyId'
    delete:
      tags: [channels]
      operationId: revokeIngestKey
      summary: Revoke an ingest key
      description: |
        Reports with this key are refused from now on; reports already sent stay. Revoking
        a revoked key changes nothing. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /channels/{id}/identity-secret:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [channels]
      operationId: rotateIdentitySecret
      summary: Replace the secret that signs the app user's identity
      description: |
        The old secret stops working at once: identity tokens the company's backend signed
        with it are no longer accepted, and their reports come in as unconfirmed. The new
        secret is returned only here. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The new secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySecret' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/app-limits:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [channels]
      operationId: setAppLimits
      summary: Change the limits of an app channel
      description: |
        Within the platform's maximums: a file up to 25 MB, up to 5 files and 50 MB a report,
        files kept 1 to 365 days, a daily quota of reports and megabytes. Requires
        `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppLimits' }
      responses:
        '200':
          description: The channel with the new limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/reports:
    post:
      tags: [ingest]
      operationId: createIngestReport
      summary: Register a problem report and get upload links for its files
      description: |
        The body is limited by the channel's settings: up to 5 files (`413 too_many_files`),
        a file up to 25 MB (`413 file_too_large`), up to 50 MB a report (`413
        report_too_large`); allowed types are text, CSV, JSON, XML, ZIP, GZIP, PNG and JPEG
        (`415 unsupported_type`). Each upload link lives 15 minutes and fixes the size, the
        type and the SHA-256. `report_token` is shown once: send it to complete the report
        and, later, to read the replies.

        With `contact.identity_token` = hex HMAC-SHA256 of `contact.external_id` under the
        channel's identity secret, signed by the company's backend, the contact is
        verified. A missing or wrong token makes an unverified contact, never an error:
        `contact_verified` says which.

        A retry with the same `Idempotency-Key` and body, before the report is completed,
        answers `200` with the same report, a new token (the first stops working) and fresh
        links.
      security:
        - ingestKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestReportRequest' }
      responses:
        '200':
          description: A retry with the same `Idempotency-Key` and body.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestReportCreated' }
        '201':
          description: Registered; upload the files next.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestReportCreated' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/InvalidIngestKey' }
        '409':
          description: '`report_submitted`: the `Idempotency-Key` names a report already completed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/ReportTooLarge' }
        '415':
          description: '`unsupported_type`: a file type is not allowed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`idempotency_key_reused`: the key was used with a different body.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/IngestLimited' }

  /ingest/reports/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ReportToken'
    post:
      tags: [ingest]
      operationId: completeIngestReport
      summary: Finish a report after its files are uploaded
      description: |
        Checks that every file is in storage with its declared size and submits the report;
        it then becomes a conversation. Completing twice answers `202` again. Another
        channel's report or a wrong token answers `404`. Rate: 30 a minute per IP.
      security:
        - ingestKey: []
      responses:
        '202':
          description: Submitted.
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/InvalidIngestKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`upload_incomplete`: a file is missing or of another size; `detail` names it.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/IngestLimited' }

  /files/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: |
          Object key `ws/{workspace_id}/{kind}/{uuid}`. It spans several path
          segments: the slashes are sent unescaped.
        schema: { type: string }
      - name: exp
        in: query
        required: true
        description: Expiry of the link, Unix seconds.
        schema: { type: integer, format: int64 }
      - name: sig
        in: query
        required: true
        description: HMAC signature over the method, the key and every other query parameter.
        schema: { type: string }
    get:
      tags: [files]
      operationId: downloadFile
      summary: Download a file by a signed link
      security: []
      parameters:
        - name: type
          in: query
          description: Content type to answer with; `application/octet-stream` when absent.
          schema: { type: string }
        - name: name
          in: query
          description: File name for `Content-Disposition`.
          schema: { type: string }
      responses:
        '200':
          description: |
            The file, always as an attachment (`Content-Disposition`, `nosniff`, sandbox CSP,
            `Cache-Control: private, no-store`). Range and conditional requests are supported.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content for a `Range` request.
        '403': { $ref: '#/components/responses/LinkRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [files]
      operationId: uploadFile
      summary: Upload a file by a signed link
      description: |
        The link decides the key, the size limits, the digest and the content type; the
        request only supplies the bytes. Each upload link works once.
      security: []
      parameters:
        - name: max
          in: query
          required: true
          description: Largest accepted body, bytes.
          schema: { type: integer, format: int64 }
        - name: size
          in: query
          description: Exact body size, bytes, when the link fixes it.
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          description: Required `Content-Type` of the request when present.
          schema: { type: string }
        - name: sha256
          in: query
          description: Hex SHA-256 the body must match when present.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored (an empty body, as S3 answers a PUT).
        '400':
          description: '`size_mismatch` or `checksum_mismatch`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/LinkRejected' }
        '408':
          description: '`upload_timeout`: the client was too slow; nothing was stored.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`already_uploaded`: the link has been used.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: '`file_too_large`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: '`content_type_mismatch`: `Content-Type` differs from the link.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: The inbox, most recent activity first
      description: Requires `conversations.view` (owner, admin, operator).
      parameters:
        - name: status
          in: query
          description: Any of these statuses; repeat the parameter for several. All when absent.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/ConversationStatus' }
        - name: assignee
          in: query
          description: '`me`, `none` (unassigned) or a member''s user id.'
          schema: { type: string }
        - name: contact_id
          in: query
          description: |
            Only this contact's conversations: the history in the customer card. An unknown id
            gives an empty page.
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of conversations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Start a conversation with an existing contact
      description: |
        Requires `conversations.create` (owner, admin). The conversation enters the
        queue (`queued`) at once. Channels create theirs from inbound messages.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations/counts:
    get:
      tags: [conversations]
      operationId: getInboxCounts
      summary: Counters of the inbox tabs for the caller
      description: Requires `conversations.view`.
      responses:
        '200':
          description: The counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxCounts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [conversations]
      operationId: getConversation
      summary: One conversation
      description: Requires `conversations.view`.
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [conversations]
      operationId: changeConversationStatus
      summary: Move the conversation along the state machine
      description: |
        Requires `conversations.reply`; without `conversations.manage` only for a
        conversation assigned to the caller. Moving to `queued` releases the assignee;
        `assigned` is reachable only when the conversation already has an assignee
        (otherwise use `PUT /conversations/{id}/assignee`).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStatusRequest' }
      responses:
        '200':
          description: The changed conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /conversations/{id}/assignee:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [conversations]
      operationId: assignConversation
      summary: Assign, transfer or release the conversation
      description: |
        `conversations.take` allows taking an unassigned conversation for yourself and
        releasing (`assignee_id: null`) or transferring your own; `conversations.assign`
        (owner, admin) allows any assignment. The assignee must be an active member of the workspace.
        `queued` and `resolved` become `assigned`; `assigned` and `pending` keep their
        status (transfer); releasing makes an `assigned` conversation `queued`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRequest' }
      responses:
        '200':
          description: The changed conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [conversations]
      operationId: listMessages
      summary: The conversation feed, newest first
      description: Requires `conversations.view`. Includes internal notes (`is_private`).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [conversations]
      operationId: postMessage
      summary: Reply or leave an internal note
      description: |
        A reply needs `conversations.reply` and, without `conversations.manage`, a
        conversation assigned to the caller. A note (`private: true`) needs
        `conversations.note` and works in any conversation. Attachments are uploads of
        the same conversation (`POST /conversations/{id}/attachments`) whose files are
        in storage; they are checked and linked here. A closed conversation answers
        `409 conversation_closed`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostMessageRequest' }
      responses:
        '200':
          description: A retry with the same `Idempotency-Key` and body; the first message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '`idempotency_key_reused`: the key was used with a different body.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /conversations/{id}/messages/{message_id}/retry:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [conversations]
      operationId: retryMessageDelivery
      summary: Send a failed reply again
      description: |
        Needs the same rights as replying (`conversations.reply`, and without
        `conversations.manage` a conversation assigned to the caller). The reply goes back
        to `delivery_status: pending` and is queued; pieces delivered before (the first part
        of a long text, the first files) are not sent twice. Only a reply with
        `delivery_status: failed` can be retried: others answer `409 not_failed`; a closed
        conversation answers `409 conversation_closed`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The reply, pending again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`not_failed` or `conversation_closed`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /conversations/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [conversations]
      operationId: setConversationTags
      summary: Replace the tags of the conversation
      description: |
        Requires `conversations.tag`; works in any visible conversation, closed ones too.
        At most 20 tags; every id must be a tag of the workspace (`GET /tags`).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTagsRequest' }
      responses:
        '200':
          description: The conversation with its new tags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /conversations/{id}/read:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [conversations]
      operationId: markConversationRead
      summary: Mark the conversation read up to a message for the caller
      description: |
        Requires `conversations.view`. Read marks are per member and only move forward:
        an older message than the current mark changes nothing. A move sends
        `conversation.read` over the realtime connection.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkReadRequest' }
      responses:
        '204':
          description: Marked, or the mark was already further.
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [conversations]
      operationId: createAttachmentUpload
      summary: Register a file and get a signed upload request
      description: |
        Requires `conversations.reply` or `conversations.note`. The server picks an
        unpredictable key `ws/{workspace_id}/conv/{uuid}` (docs/02 §5.4) and signs a PUT
        that fixes the size, the content type and, when given, the SHA-256. Upload the
        file with exactly the returned method, URL and headers, then send the attachment
        id with a message. Up to 25 MB; images, PDF, text, CSV, JSON, ZIP, GZIP and
        Office documents.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '201':
          description: Registered; upload the file next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUpload' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attachments/{id}/download-link:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [conversations]
      operationId: getAttachmentDownloadLink
      summary: A short-lived signed download request for a sent attachment
      description: Requires `conversations.view`. Attachments not yet sent with a message answer `404`.
      responses:
        '200':
          description: The signed request (15 minutes by default).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tags:
    get:
      tags: [conversations]
      operationId: listTags
      summary: Every tag of the workspace, by name
      description: Requires `conversations.view`. At most 500, so there are no pages.
      responses:
        '200':
          description: The tags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [conversations]
      operationId: createTag
      summary: Create a tag
      description: |
        Requires `tags.manage` (owner, admin). Names are unique in the workspace without
        regard to case; a taken name answers `409 tag_exists`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`tag_exists`: a tag with this name exists.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      summary: Contacts, newest first
      description: Requires `contacts.view` (owner, admin, operator).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of contacts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [contacts]
      operationId: createContact
      summary: Add a contact
      description: Requires `contacts.edit` (owner, admin, operator).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [contacts]
      operationId: getContact
      summary: One contact
      description: Requires `contacts.view`.
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [contacts]
      operationId: updateContact
      summary: Change a contact
      description: |
        Requires `contacts.edit`. Absent fields stay as they are; an empty `email`,
        `phone` or `locale` clears it.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '200':
          description: The changed contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    ReportToken:
      name: X-Report-Token
      in: header
      required: true
      description: '`report_token` from the answer that created the report.'
      schema: { type: string, minLength: 1, maxLength: 128 }
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import: { path: github.com/google/uuid }
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import: { path: github.com/google/uuid }
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import: { path: github.com/google/uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` of the previous page.
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      description: Page size, 1–100; 50 when absent.
      schema: { type: integer, minimum: 1, maximum: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a retry return the first result instead of acting twice (docs/00 §8). A
        reused key with a different body answers `422`.
      schema: { type: string, minLength: 1, maxLength: 255 }

  securitySchemes:
    ingestKey:
      type: http
      scheme: bearer
      description: An ingest key of an app channel, `tk_ingest_…` (docs/02 §11.6).
    sessionCookie:
      type: apiKey
      in: cookie
      name: tolkovo_session
      description: '`__Host-tolkovo_session` outside development.'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: '`csrf_token` of the current session. Required on every unsafe method.'

  headers:
    RateLimitLimit:
      description: Reports allowed per hour for the ingest key.
      schema: { type: integer }
    RateLimitRemaining:
      description: Reports left in the current hour.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the hour starts over.
      schema: { type: integer }
    SetSessionCookie:
      description: The session cookie (`HttpOnly; SameSite=Lax; Path=/`, `Secure` outside development).
      schema: { type: string }

  responses:
    Invalid:
      description: '`invalid_request`: malformed JSON, unknown fields or invalid values.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: '`unauthenticated` (no or expired session) or `invalid_credentials` (login).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden` (missing permission), `csrf_failed`, `cross_origin` or `no_workspace`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`not_found`, also for resources of other workspaces.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkRejected:
      description: '`link_invalid` (bad signature or parameters) or `link_expired`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        `invalid_transition` (the state machine forbids it), `version_conflict` (the
        conversation changed since `version`), `conversation_closed` or
        `attachment_not_uploaded` (the file of an attachment is not in storage).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidToken:
      description: '`invalid_token`: the link is unknown, used, revoked or expired.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EmailDisabled:
      description: '`email_disabled`: outgoing email is not configured on this server.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`too_many_requests`; see `Retry-After`.'
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    InvalidIngestKey:
      description: '`invalid_key`: the ingest key is missing, malformed, unknown or revoked.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ReportTooLarge:
      description: |
        `too_many_files`, `file_too_large` or `report_too_large`: the report breaks a limit
        of the channel; `detail` gives it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IngestLimited:
      description: |
        `too_many_requests` (a rate per IP or key) or `daily_quota_exceeded` (the channel's
        reports or megabytes for the UTC day).
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ChannelExists:
      description: '`channel_exists`: this bot or account is a channel already, here or in another workspace.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LoginStep:
      description: |
        `login_step` (the login is finished, cancelled or waits for another step) or
        `login_expired` (more than 15 minutes since the phone was entered: start again).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TelegramLoginRejected:
      description: |
        Telegram refused the login: `telegram_phone_invalid`, `telegram_no_account` (no
        Telegram account for the number), `telegram_banned`, `telegram_code_invalid`,
        `telegram_code_expired` or `telegram_password_invalid`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TelegramUnavailable:
      description: '`telegram_unavailable`: Telegram could not be reached or answered unexpectedly.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ChannelsUnavailable:
      description: |
        `encryption_unavailable` (`TOLKOVO_MASTER_KEY` is not set, secrets cannot be stored)
        or `telegram_user_unavailable` (no Telegram application for personal accounts:
        `TOLKOVO_TELEGRAM_API_ID`, `TOLKOVO_TELEGRAM_API_HASH`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Stable machine-readable error code. }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }

    Locale:
      type: string
      enum: [ru, en]

    Role:
      type: string
      description: System role in phase 1 (docs/04 §4.2).
      enum: [owner, admin, operator]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name, workspace_name, workspace_slug]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: '#/components/schemas/Locale' }
        workspace_name: { type: string, minLength: 1, maxLength: 120 }
        workspace_slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
        timezone:
          type: string
          description: IANA time zone; defaults to Europe/Moscow.
          maxLength: 64

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }

    SwitchWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }

    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: '#/components/schemas/Locale' }
        timezone: { type: string, maxLength: 64 }

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: Trimmed; 1–120 characters after trimming. }
        locale:
          $ref: '#/components/schemas/Locale'
          description: Interface language of the panel (docs/04 §8.2).

    EmailDelayMinutes:
      type: integer
      enum: [5, 15, 30, 60]
      description: How long customer messages may stay unread before the email goes out.

    NotificationSettings:
      type: object
      required: [email_missed, email_delay_minutes, email_available]
      properties:
        email_missed:
          type: boolean
          description: |
            Email the user when a conversation assigned to them keeps unread customer messages
            for `email_delay_minutes`. Goes only to a confirmed email (`User.email_verified`),
            without message texts. On by default.
        email_delay_minutes: { $ref: '#/components/schemas/EmailDelayMinutes' }
        email_available:
          type: boolean
          description: Outgoing email is configured on this server; without it nothing is sent.

    UpdateNotificationSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        email_missed: { type: boolean }
        email_delay_minutes: { $ref: '#/components/schemas/EmailDelayMinutes' }

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128 }

    DeviceSession:
      type: object
      description: |
        One signed-in browser of the user (docs/02 §13.1). The `id` is a public random
        identifier, not the session token.
      required: [id, created_at, last_seen_at, user_agent, current]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        created_at: { type: string, format: date-time, description: When the session started. }
        last_seen_at:
          type: string
          format: date-time
          description: Last request; recorded at most every 5 minutes.
        user_agent:
          type: string
          maxLength: 200
          description: '`User-Agent` at sign-in, shortened; empty when the client sent none.'
        current: { type: boolean, description: This is the session of the request. }

    DeviceSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceSession' }

    User:
      type: object
      required: [id, email, name, locale, email_verified]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        email: { type: string }
        name: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        email_verified:
          type: boolean
          description: |
            The user proved they own the email: the confirmation link, an accepted
            invitation or a password reset.

    Workspace:
      type: object
      required: [id, slug, name, locale, timezone]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        slug: { type: string }
        name: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        timezone: { type: string }

    WorkspaceSummary:
      type: object
      required: [id, slug, name, role]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceSummary' }

    Session:
      type: object
      required: [user, workspace, role, permissions, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        workspace: { $ref: '#/components/schemas/Workspace' }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          description: Permissions of the role in this workspace, sorted (docs/04 §4.1).
          items: { type: string }
        csrf_token:
          type: string
          description: Send it as `X-CSRF-Token` on unsafe requests.

    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 200, description: The fragment of the emailed link. }

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 128 }

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        password:
          type: string
          maxLength: 128
          description: The new account's password (8–128), or the existing account's one.
        name:
          type: string
          maxLength: 120
          description: Required when no account exists for the invited email.
        locale:
          $ref: '#/components/schemas/Locale'
          description: Interface language of a new account; the workspace's when absent.

    InvitationPreview:
      type: object
      required: [workspace_name, email, role, expires_at, account_exists]
      properties:
        workspace_name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        expires_at: { type: string, format: date-time }
        account_exists:
          type: boolean
          description: An account with this email exists; accept with its password.

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, maxLength: 254 }
        role:
          type: string
          enum: [admin, operator]

    Invitation:
      type: object
      required: [id, email, role, invited_by_name, expires_at, created_at, expired]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        invited_by_name:
          type: string
          description: Empty when the inviter's account is gone.
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        expired: { type: boolean }

    InvitationSent:
      type: object
      required: [invitation]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        invite_url:
          type: string
          description: |
            Present only when the server cannot send email: the link to pass on. It is
            shown once; resend issues a new one.

    InvitationList:
      type: object
      required: [items, email_enabled]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        email_enabled:
          type: boolean
          description: The server emails invitations; otherwise the panel shows the link.

    Member:
      type: object
      required: [user_id, email, name, role, active]
      properties:
        user_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }

    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }

    ConversationStatus:
      type: string
      description: State of a conversation (docs/02 §8).
      enum: [new, bot, queued, assigned, pending, resolved, closed]

    ContactRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        name: { type: string }

    Conversation:
      type: object
      required: [id, number, status, priority, line_level, contact, assignee_id, channel_id, subject,
                 first_response_at, last_message_at, resolved_at, closed_at, version, created_at, updated_at,
                 last_message, tag_ids, last_read_message_id, unread_count]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        number: { type: integer, format: int64, description: Human-readable number inside the workspace. }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        priority: { type: integer, minimum: 0, maximum: 3 }
        line_level: { type: integer, minimum: 1, maximum: 3 }
        contact: { $ref: '#/components/schemas/ContactRef' }
        assignee_id:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        channel_id:
          type: [string, 'null']
          description: '`null` for conversations started from the panel or API.'
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        subject: { type: [string, 'null'] }
        first_response_at: { type: [string, 'null'], format: date-time }
        last_message_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        version:
          type: integer
          description: Bumps on every change; send it back to detect concurrent edits.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_message:
          description: |
            The newest message the customer could see, for the inbox list: internal notes and
            system events are skipped. `null` until there is one.
          oneOf:
            - $ref: '#/components/schemas/ConversationPreview'
            - type: 'null'
        tag_ids:
          type: array
          maxItems: 20
          description: Tags in the order they were added; names and colors are in `GET /tags`.
          items:
            type: string
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }
        last_read_message_id:
          type: [string, 'null']
          description: The caller's read mark; `null` when they have not read the conversation.
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        unread_count:
          type: integer
          minimum: 0
          maximum: 100
          description: Customer messages after the caller's read mark, counted up to 100.

    ConversationPreview:
      type: object
      required: [sender_type, kind, text, attachments, created_at]
      properties:
        sender_type: { type: string, enum: [contact, operator, bot, system] }
        kind: { type: string, enum: [text, media] }
        text:
          type: string
          maxLength: 200
          description: The start of the message on one line; empty when it has only files.
        attachments: { type: integer, minimum: 0, description: Number of attached files. }
        created_at: { type: string, format: date-time }

    InboxCounts:
      type: object
      description: |
        Counters of the inbox tabs. `mine`: assigned to the caller, `assigned` or `pending`;
        `mine_unread`: of those, with customer messages after the caller's read mark (the
        counter in the tab title); `unassigned`: `queued`; `open`: every status before
        `resolved`.
      required: [mine, mine_unread, unassigned, open]
      properties:
        mine: { type: integer, format: int64, minimum: 0 }
        mine_unread: { type: integer, format: int64, minimum: 0 }
        unassigned: { type: integer, format: int64, minimum: 0 }
        open: { type: integer, format: int64, minimum: 0 }

    ConversationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_cursor:
          type: [string, 'null']
          description: Cursor of the next page; `null` on the last one.

    CreateConversationRequest:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        subject: { type: string, maxLength: 200 }
        priority: { type: integer, minimum: 0, maximum: 3 }

    ChangeStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ConversationStatus' }
        version:
          type: integer
          description: When set, must equal the current version, otherwise `409 version_conflict`.

    AssignRequest:
      type: object
      additionalProperties: false
      required: [assignee_id]
      properties:
        assignee_id:
          type: [string, 'null']
          description: The member to assign; `null` releases the conversation to the queue.
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        version:
          type: integer
          description: When set, must equal the current version, otherwise `409 version_conflict`.

    Attachment:
      type: object
      required: [id, file_name, content_type, size, status]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        file_name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        status:
          type: string
          enum: [uploading, scanning, ready, rejected, expired]

    Message:
      type: object
      required: [id, conversation_id, direction, sender_type, sender_id, kind, body, is_private,
                 delivery_status, attachments, event, created_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        conversation_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        direction: { type: string, enum: [in, out] }
        sender_type: { type: string, enum: [contact, operator, bot, system] }
        sender_id:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        kind: { type: string, enum: [text, media, note, event] }
        body: { type: string }
        is_private: { type: boolean, description: Internal note; never shown to the customer. }
        delivery_status:
          type: [string, 'null']
          description: |
            `pending`, `sent`, `delivered`, `read` or `failed`; `null` when there is nothing
            to deliver (notes, conversations without a channel). A reply in a Telegram
            conversation is `pending` until the channel sends it, then `sent`; a personal
            account also reports `read` when the customer opens the chat (a bot cannot).
            Changes come as `message.delivery` over the realtime connection.
        delivery_error:
          type: string
          enum: [blocked, chat_not_found, limited, rejected, channel_unavailable, failed]
          description: |
            Why a reply was not delivered; present only with `delivery_status: failed`.
            `blocked`: the customer blocked the bot or the account. `chat_not_found`: the
            chat or the customer's account is gone, or the personal account cannot address
            them. `limited`: Telegram restricted the account from writing. `rejected`:
            Telegram refused this message (size, format). `channel_unavailable`: the channel
            is disconnected or needs the admin. `failed`: Telegram stayed unreachable
            through every retry (about 40 minutes); `POST …/retry` sends it again.
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        event:
          description: |
            What a system message (`kind: event`) records; `null` for other kinds. The body of
            a system message is empty: clients render the line in the reader's language.
            For `sender_type: system` `sender_id` is the member who acted, `null` for the
            system itself.
          oneOf:
            - $ref: '#/components/schemas/MessageEvent'
            - type: 'null'
        unsupported:
          type: string
          enum: [sticker, location, contact, poll, other]
          description: |
            Set on a customer message from a channel that holds something the panel does not
            show (a sticker, a location…) instead of text and files; absent otherwise.
        sent_outside_panel:
          type: boolean
          description: |
            `true` on an operator message the owner of a personal Telegram account wrote in
            their own Telegram app (`sender_id` is `null`); absent otherwise.
        created_at: { type: string, format: date-time }

    MessageEvent:
      type: object
      required: [type, from, to, assignee_id, previous_assignee_id]
      properties:
        type:
          type: string
          enum: [status_changed, assigned]
          description: '`assigned` covers taking, transferring and releasing.'
        from: { $ref: '#/components/schemas/ConversationStatus' }
        to: { $ref: '#/components/schemas/ConversationStatus' }
        assignee_id:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        previous_assignee_id:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { $ref: '#/components/schemas/TagColor' }

    TagColor:
      type: string
      enum: [gray, teal, amber, red, violet, blue, green]
      description: A palette key of the panel, readable in both themes.

    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Spaces are collapsed; must contain more than spaces.
        color: { $ref: '#/components/schemas/TagColor' }

    SetTagsRequest:
      type: object
      additionalProperties: false
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }
        version:
          type: integer
          description: When set, must equal the current version, otherwise `409 version_conflict`.

    MarkReadRequest:
      type: object
      additionalProperties: false
      required: [up_to_message_id]
      properties:
        up_to_message_id:
          type: string
          description: The newest message the caller has seen; a message of this conversation.
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }

    MessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor: { type: [string, 'null'] }

    PostMessageRequest:
      type: object
      additionalProperties: false
      properties:
        body: { type: string, maxLength: 10000, description: Plain text; may be empty when attachments are sent. }
        private: { type: boolean, description: Internal note instead of a reply. }
        attachment_ids:
          type: array
          maxItems: 10
          items:
            type: string
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }

    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [file_name, content_type, size]
      properties:
        file_name: { type: string, minLength: 1, maxLength: 1024 }
        content_type: { type: string, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1, maximum: 26214400 }
        sha256:
          type: string
          description: Hex SHA-256 of the file; the storage then rejects any other content.
          pattern: '^[0-9a-f]{64}$'

    SignedRequest:
      type: object
      required: [method, url, headers, expires_at]
      properties:
        method: { type: string }
        url: { type: string }
        headers:
          type: object
          description: Headers to send exactly as given.
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }

    AttachmentUpload:
      type: object
      required: [attachment, upload]
      properties:
        attachment: { $ref: '#/components/schemas/Attachment' }
        upload: { $ref: '#/components/schemas/SignedRequest' }

    Contact:
      type: object
      required: [id, name, email, phone, locale, created_at, updated_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        locale: { type: [string, 'null'], description: '`ru`, `en` or `null`.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContactPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        next_cursor: { type: [string, 'null'] }

    ContactInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        locale:
          type: string
          description: '`ru` or `en`; empty clears it on update.'
          maxLength: 2

    ChannelType:
      type: string
      description: '`app` — reports from a company app (docs/02 §11.6).'
      enum: [telegram_bot, telegram_user, app]

    ChannelStatus:
      type: string
      description: |
        `pending` — a personal-account login in progress; `active` — works; `error` — needs
        the admin, `error_code` says why: `token_revoked` (the bot's token was revoked in
        @BotFather), `session_revoked` (the session was ended in Telegram), `banned` (Telegram
        blocked the account). The admin disconnects the channel and connects it again.
      enum: [pending, active, error]

    ChannelDetails:
      type: object
      description: What may be shown about the channel. Never secrets.
      required: [username, display_name, phone_masked]
      properties:
        username: { type: [string, 'null'], description: 'Without "@".' }
        display_name: { type: [string, 'null'], description: The bot's or the account's name in Telegram. }
        phone_masked: { type: [string, 'null'], description: 'Personal accounts: e.g. "+79•••••••67".' }
        delivery:
          type: string
          description: 'Bots only: Telegram pushes updates to a webhook, or the worker polls.'
          enum: [webhook, polling]
        app_limits: { $ref: '#/components/schemas/AppLimits' }

    Channel:
      type: object
      required: [id, type, name, status, error_code, details, last_inbound_at, created_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        type: { $ref: '#/components/schemas/ChannelType' }
        name: { type: string, description: Name in the panel. }
        status: { $ref: '#/components/schemas/ChannelStatus' }
        error_code: { type: [string, 'null'] }
        details: { $ref: '#/components/schemas/ChannelDetails' }
        last_inbound_at:
          type: [string, 'null']
          format: date-time
          description: When a customer message last came in, to the minute; `null` before the first.
        created_at: { type: string, format: date-time }

    ChannelList:
      type: object
      required: [items, telegram_user_available, encryption_available]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        telegram_user_available:
          type: boolean
          description: Personal Telegram accounts can be connected on this server.
        encryption_available:
          type: boolean
          description: '`TOLKOVO_MASTER_KEY` is set; without it nothing can be connected.'

    ConnectTelegramBotRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 100, description: The token from @BotFather. }
        name: { type: string, maxLength: 120 }

    StartTelegramUserLoginRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { type: string, maxLength: 32, description: 'International format, e.g. "+7 900 123-45-67".' }

    TelegramCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, maxLength: 16 }

    TelegramPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, format: password, maxLength: 256 }

    TelegramLogin:
      type: object
      required: [channel, next]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        next:
          type: string
          enum: [code, password, done]
        code_via:
          type: string
          description: Where Telegram sent the code; present after the phone step.
          enum: [app, sms, call, other]

    AppLimits:
      type: object
      description: Limits of an app channel (`details.app_limits`).
      additionalProperties: false
      required: [max_file_mb, max_files, max_report_mb, retention_days, daily_reports, daily_mb]
      properties:
        max_file_mb: { type: integer, minimum: 1, maximum: 25, description: One file in MB. }
        max_files: { type: integer, minimum: 1, maximum: 5, description: Files in one report. }
        max_report_mb: { type: integer, minimum: 1, maximum: 50, description: All files of one report in MB. }
        retention_days: { type: integer, minimum: 1, maximum: 365, description: 'Files are deleted after it; the messages stay.' }
        daily_reports: { type: integer, minimum: 1, maximum: 10000, description: Reports a day for the channel. }
        daily_mb: { type: integer, minimum: 1, maximum: 100000, description: Megabytes of files a day for the channel. }

    ConnectAppChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 120, description: 'Usually the app''s name, e.g. "Зерно для Windows".' }

    IngestKey:
      type: object
      required: [id, name, prefix, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        name: { type: string }
        prefix: { type: string, description: 'The start of the key, e.g. "tk_ingest_Xb3k9Q".' }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    IngestKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IngestKey' }

    CreateIngestKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 120, description: 'Where the key goes, e.g. "Сборка 2.4".' }

    IngestKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: '#/components/schemas/IngestKey' }
        secret:
          type: string
          description: '`tk_ingest_…`, the whole key. The server keeps only its hash.'

    IdentitySecret:
      type: object
      required: [identity_secret]
      properties:
        identity_secret:
          type: string
          description: |
            `tk_identity_…`. Lives only on the company's backend, never in the app: the backend
            signs `identity_token` = HMAC-SHA256(`external_id`, secret), hex.

    AppChannelCreated:
      type: object
      required: [channel, ingest_key, identity_secret]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        ingest_key: { $ref: '#/components/schemas/IngestKeyCreated' }
        identity_secret: { type: string, description: See `IdentitySecret`. }

    IngestReportRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 10000, description: What the user wrote. }
        contact: { $ref: '#/components/schemas/IngestContact' }
        app: { $ref: '#/components/schemas/IngestApp' }
        files:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/IngestFile' }

    IngestContact:
      type: object
      additionalProperties: false
      description: Who the app user says they are. Every field is optional.
      properties:
        external_id: { type: string, maxLength: 255, description: The user's id in the company's system. }
        email: { type: string, maxLength: 254 }
        name: { type: string, maxLength: 120 }
        identity_token:
          type: string
          maxLength: 128
          description: Hex HMAC-SHA256 of `external_id` under the channel's identity secret.

    IngestApp:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        version: { type: string, maxLength: 50 }
        os: { type: string, maxLength: 50 }
        os_version: { type: string, maxLength: 100 }
        locale: { type: string, maxLength: 35 }
        extra:
          type: object
          description: Up to 20 more facts, values up to 500 characters.
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }

    IngestFile:
      type: object
      additionalProperties: false
      required: [name, size, content_type, sha256]
      properties:
        name: { type: string, minLength: 1, maxLength: 1024 }
        size: { type: integer, format: int64, minimum: 1 }
        content_type: { type: string, maxLength: 255 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Hex SHA-256 of the file. }

    IngestReportCreated:
      type: object
      required: [report_id, report_token, contact_verified, uploads]
      properties:
        report_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        report_token: { type: string, description: 'Shown once; send it as `X-Report-Token`.' }
        contact_verified: { type: boolean }
        uploads:
          type: array
          description: One per file, in the order of `files`.
          items: { $ref: '#/components/schemas/IngestUpload' }

    IngestUpload:
      type: object
      required: [name, upload]
      properties:
        name: { type: string }
        upload: { $ref: '#/components/schemas/SignedRequest' }

    RenameChannelRequest:

openapi: 3.1.0
info:
  title: Tolkovo API
  version: 0.1.0
  description: |
    The single source of truth for the Tolkovo REST API.
    Server code is generated from this file (`make gen`); never edit the generated code.

    ## Authentication

    The panel authenticates with an opaque session token in an `HttpOnly`,
    `SameSite=Lax` cookie. The cookie is `Secure` outside development and is then
    named `__Host-tolkovo_session`; in development it is `tolkovo_session`.
    Sessions live on the server (Redis): logout, workspace switching, a password change
    and `/me/sessions` revoke them immediately.

    The workspace of a request always comes from the session, never from the body or
    the URL. A resource of another workspace answers `404`, a missing permission in
    your own workspace answers `403`.

    ## CSRF

    Every unsafe request (`POST`, `PUT`, `PATCH`, `DELETE`) authenticated by the cookie
    must send the session's CSRF token in the `X-CSRF-Token` header. The token is
    returned in `csrf_token` of every `Session` response (register, login, workspace
    switch, `GET /me`) and changes with the session. Unsafe requests with an `Origin`
    header from another origin are rejected, including login and registration.

    ## Errors

    Errors are RFC 9457 `application/problem+json` documents with a stable `code`.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: workspace
  - name: files
    description: |
      Signed upload and download links of the `fs` storage driver.
      Mounted only with `TOLKOVO_STORAGE_DRIVER=fs`;
      with `s3` the links point at the bucket. Authorised by the link signature, not
      by the session. Served by hand (`internal/api/files.go`), not generated.
  - name: conversations
    description: |
      Conversations, their messages and attachments. Status changes
      follow the conversation state machine; a forbidden transition answers `409
      invalid_transition`. Operators reply in and change only conversations assigned to
      them; `conversations.manage` (owner, admin) lifts that limit.
  - name: contacts
    description: Customers. Email and phone are personal data.
  - name: channels
    description: |
      Where customers write from: a Telegram bot connected by its
      token, a personal Telegram account signed in by phone over MTProto, a company app's
      reports, or a chat widget. Secrets (the token, the account session, identity secrets)
      are encrypted and never returned. Requires
      `channels.view` to read and `channels.manage` to change (owner, admin).
  - name: integrations
    description: |
      Outside trackers. Phase 1 has GitHub: the workspace creates
      its own GitHub App from a manifest (issues read and write, metadata read, no access to
      code), installs it on its repositories and picks the repository, labels and templates.
      The App's private key and webhook secret are encrypted and never returned. Requires
      `integrations.manage` (owner, admin).
  - name: ingest
    description: |
      Problem reports from company apps. Authenticated by an ingest key of
      an app channel in `Authorization: Bearer tk_ingest_…`, not by a session; call these
      from the app's main process or backend (no CORS yet). The key only creates
      reports. Create the report, upload every file with exactly the returned method, URL
      and headers, then complete it. Rates: 10 reports a minute per IP and 60 an hour per
      key; the channel's daily quota of reports and megabytes. Errors carry a `code`;
      `429` carries `Retry-After`.
  - name: widget
    description: |
      The visitor's side of the chat widget, called by `@tolkovo/widget`
      from a site or an Electron app. Cross-origin: only pages whose `Origin` is on the
      widget's list are answered (CORS without credentials). A session token in
      `Authorization: Bearer tk_wsess_…` stands in for the cookie. Live events come over
      `GET /api/v1/widget/realtime` (WebSocket, subprotocols `tolkovo.widget.v1` and the
      token; api/ws/widget-message.schema.json).

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and its first workspace
      description: |
        Creates the user, the workspace and the owner membership atomically, then
        starts a session in that workspace. Rate limited per client IP. Answers `403
        registration_closed` when the server does not take new accounts (see
        `GET /auth/registration`); people then join by invitation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered and signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`email_taken` or `slug_taken`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/registration:
    get:
      tags: [auth]
      operationId: getRegistration
      summary: Whether this server takes new accounts
      description: |
        Set by the server's `TOLKOVO_REGISTRATION`: `open` takes anyone; `first`, the
        self-host default, takes only the first account, which becomes the owner of the
        first workspace, and everyone else joins by invitation; `closed` takes nobody.
        Invitations work in every mode. The panel hides "Create workspace" when `open`
        is false.
      security: []
      responses:
        '200':
          description: The registration state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationState' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Always starts a new session (any session cookie sent along is revoked) in the
        user's first workspace; switch with `POST /auth/workspace`. The answer for an
        unknown email, a wrong password and a disabled account is the same
        `invalid_credentials`. Rate limited per email and client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/workspace:
    post:
      tags: [auth]
      operationId: switchWorkspace
      summary: Switch the session to another workspace of the user
      description: |
        Requires an active membership in the target workspace, otherwise `404`.
        The old session is revoked and a new one (new cookie, new CSRF token) is issued.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchWorkspaceRequest' }
      responses:
        '200':
          description: Switched.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/invitation/preview:
    post:
      tags: [auth]
      operationId: previewInvitation
      summary: Show an invitation before accepting it
      description: |
        `token` is the fragment of the invitation link. An unknown, revoked, accepted or
        expired invitation answers `422 invalid_token`. `account_exists` tells the panel
        whether to ask for a password only or for a name and a new password. Rate limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/invitation/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Accept an invitation and sign in to its workspace
      description: |
        Without an account for the invited email, `name` and `password` (8–128 characters)
        create one; its email counts as confirmed. With an account, `password` must be the
        account's password (`401 invalid_credentials` otherwise) and `name` is ignored. A
        deactivated member is reactivated with the invited role; an active member answers
        `409 already_member`. Starts a session in the invitation's workspace, as login does.
        Rate limited per client IP and email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: Accepted and signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`already_member`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: |
        Answers `202` whether or not the email belongs to an account, so the answer does
        not reveal registered addresses. The link works for 1 hour and only the latest one
        works. Without outgoing email configured (`TOLKOVO_SMTP_HOST`) answers `503
        email_disabled`. Rate limited per client IP and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202':
          description: If the account exists, the email is on its way.
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/EmailDisabled' }

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password by a reset link
      description: |
        `token` is the fragment of the reset link; it works once. Sets the password,
        confirms the email (the link reached it) and revokes every session of the user.
        Does not sign in. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: The password is changed; sign in with it.
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm the email address by a link
      description: |
        `token` is the fragment of the confirmation link sent after registration; it works
        once, for 48 hours. Needs no session: the link may be opened in another browser.
        Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204':
          description: The email is confirmed.
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user, workspace, role and permissions
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Change the current user's profile
      description: |
        Name and interface language of the account. They belong to the user, not to the
        workspace, so they apply in every workspace of the user. Absent fields stay as they
        are; the name is trimmed. Needs a session only, no permission.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The current session with the changed user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/email/verification:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: Send the email confirmation link again
      description: |
        A new link replaces the previous one. An already confirmed email answers `409
        email_verified`. Rate limited per user.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: The email is on its way.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`email_verified`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/EmailDisabled' }

  /me/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the current user's password
      description: |
        Checks `current_password`; the new one follows the registration policy (8–128
        characters). A wrong current password answers `422 wrong_password`. Attempts are
        rate limited per user, counted before the check.

        On success every other session of the user (all devices, all workspaces) is revoked
        and the current one is replaced: a new cookie and a new `csrf_token`, as on login.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Changed; the new session.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`wrong_password`: `current_password` does not match.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: Active sessions (signed-in devices) of the current user
      description: |
        Every live session of the user across workspaces, the current one first, then by
        last activity. IP addresses are not stored.
      responses:
        '200':
          description: The user's sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSessionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/sessions/revoke-others:
    post:
      tags: [auth]
      operationId: revokeOtherSessions
      summary: Sign out on every other device
      description: Revokes every session of the user except the current one.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Other sessions revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: End one session of the current user
      description: |
        `id` is the `id` of a `DeviceSession`. A session of another user, an expired one
        and an unknown id answer `404`. The current session answers `409 current_session`:
        sign out with `POST /auth/logout` instead.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: The session is revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`current_session`: use `POST /auth/logout` to end the current session.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/notifications:
    get:
      tags: [auth]
      operationId: getMyNotificationSettings
      summary: The current user's notification settings in this workspace
      description: |
        What the server does for the user: the email about customer messages left unread in
        their conversations. Sounds and desktop notifications are settings of a browser and
        are not stored here.
      responses:
        '200':
          description: The settings; defaults until the user changes them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [auth]
      operationId: updateMyNotificationSettings
      summary: Change the current user's notification settings in this workspace
      description: Absent fields stay as they are. Needs a session only, no permission.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationSettingsRequest' }
      responses:
        '200':
          description: The changed settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/presence:
    get:
      tags: [auth]
      operationId: getMyPresence
      summary: Whether the current user accepts conversations in this workspace
      description: |
        `online` until the user changes it. With automatic distribution the router gives
        conversations only to members who are `online` and have the panel open.
      responses:
        '200':
          description: The user's status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPresence' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      tags: [auth]
      operationId: setMyPresence
      summary: Accept conversations or step away
      description: |
        `away` stops new conversations from the router; those already assigned stay with
        the user. Needs a session only, no permission.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyPresence' }
      responses:
        '200':
          description: The status now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPresence' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/workspaces:
    get:
      tags: [auth]
      operationId: listMyWorkspaces
      summary: Workspaces the current user is an active member of
      responses:
        '200':
          description: The user's workspaces, oldest membership first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /workspace:
    patch:
      tags: [workspace]
      operationId: updateWorkspace
      summary: Change settings of the current workspace
      description: Requires `workspace.manage` (owner, admin).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' }
      responses:
        '200':
          description: The updated workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members:
    get:
      tags: [workspace]
      operationId: listMembers
      summary: Members of the current workspace
      description: Requires `members.view` (owner, admin, operator).
      responses:
        '200':
          description: Members of the current workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /routing:
    get:
      tags: [workspace]
      operationId: getRouting
      summary: How the workspace distributes its queue
      description: Requires `members.view` (owner, admin, operator).
      responses:
        '200':
          description: The settings; `manual` until changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [workspace]
      operationId: setRouting
      summary: Change how the workspace distributes its queue
      description: |
        With `round_robin` the server assigns queued conversations at once and then each
        new one, in turn, to the members who are `online` with the panel open. Requires
        `routing.manage` (owner, admin).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingSettings' }
      responses:
        '200':
          description: The settings now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingSettings' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invitations:
    get:
      tags: [workspace]
      operationId: listInvitations
      summary: Open invitations of the current workspace
      description: |
        Invitations that are neither accepted nor revoked, newest first; expired ones are
        included with `expired: true` so they can be resent. Requires `members.manage`.
      responses:
        '200':
          description: Open invitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [workspace]
      operationId: createInvitation
      summary: Invite a person by email
      description: |
        Grants `admin` or `operator` (never `owner`). An open invitation to the same
        address is replaced. An active member answers `409 already_member`. The link works
        for 7 days.

        With outgoing email configured the link is emailed and `invite_url` is absent.
        Without it nothing is sent and `invite_url` holds the link for the admin to pass
        on. Requires `members.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: The invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationSent' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`already_member`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /invitations/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [workspace]
      operationId: resendInvitation
      summary: Issue a new link for an open invitation
      description: |
        The previous link stops working and the invitation is valid for another 7 days,
        also when it had expired. Emailed, or returned in `invite_url`, as on creation.
        Requires `members.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The invitation with its new expiry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationSent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [workspace]
      operationId: revokeInvitation
      summary: Revoke an open invitation
      description: Its link stops working. Requires `members.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: Channels of the current workspace
      description: |
        Connected channels and personal-account logins in progress (`pending`), oldest
        first. Requires `channels.view`.
      responses:
        '200':
          description: The channels and what can be connected on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /channels/telegram-bot:
    post:
      tags: [channels]
      operationId: connectTelegramBot
      summary: Connect a Telegram bot by its token
      description: |
        `getMe` checks the token; then the bot's updates are pointed at this server — a
        webhook when `TOLKOVO_PUBLIC_URL` is https on a port Telegram accepts, otherwise
        polling by the worker (`details.delivery`). The bot's name is used when `name` is
        absent. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectTelegramBotRequest' }
      responses:
        '201':
          description: The active channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ChannelExists' }
        '422':
          description: '`telegram_token_invalid`: Telegram does not know the token.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/TelegramUnavailable' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/telegram-user:
    post:
      tags: [channels]
      operationId: startTelegramUserLogin
      summary: Start connecting a personal Telegram account
      description: |
        Telegram sends a login code to the account (`code_via`: usually the Telegram app,
        sometimes SMS or a call). The channel stays `pending` until the code — and the
        cloud password, if the account has one — is entered, at most 15 minutes. Only
        one-to-one chats with people reach the inbox, only messages after the connection.
        Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartTelegramUserLoginRequest' }
      responses:
        '201':
          description: The pending login, waiting for the code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLogin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/TelegramLoginRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/TelegramUnavailable' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/telegram-user/code:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [channels]
      operationId: submitTelegramUserCode
      summary: Enter the login code of a personal account
      description: |
        `next: done` — the channel is active; `next: password` — the account has a cloud
        password. A wrong code (`telegram_code_invalid`) may be entered again. Requires
        `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramCodeRequest' }
      responses:
        '200':
          description: The login after the code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLogin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LoginStep' }
        '422': { $ref: '#/components/responses/TelegramLoginRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/TelegramUnavailable' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/telegram-user/password:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [channels]
      operationId: submitTelegramUserPassword
      summary: Enter the cloud password of a personal account
      description: |
        Used once for Telegram's SRP proof and never stored. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramPasswordRequest' }
      responses:
        '200':
          description: The finished login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLogin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LoginStep' }
        '422': { $ref: '#/components/responses/TelegramLoginRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/TelegramUnavailable' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [channels]
      operationId: renameChannel
      summary: Rename a channel in the panel
      description: The name customers see in Telegram does not change. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameChannelRequest' }
      responses:
        '200':
          description: The renamed channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [channels]
      operationId: disconnectChannel
      summary: Disconnect a channel
      description: |
        A bot stops sending updates here (`deleteWebhook`); a personal account's session is
        ended in Telegram (`auth.logOut`) and disappears from its devices. Telegram's answer
        does not block the removal. The secret is deleted; conversations of the channel
        stay. A login in progress is cancelled. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Disconnected.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /channels/app:
    post:
      tags: [channels]
      operationId: connectAppChannel
      summary: Connect a company app that sends problem reports
      description: |
        Creates the «Приложение» channel with its first ingest key and the
        secret that signs the app user's identity. Both are returned only here: the server
        keeps the key's hash and the secret sealed. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectAppChannelRequest' }
      responses:
        '201':
          description: The active channel, its first key and the identity secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppChannelCreated' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/ingest-keys:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [channels]
      operationId: listIngestKeys
      summary: Ingest keys of an app channel
      description: Newest first, revoked ones included. Never the keys themselves. Requires `channels.view`.
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestKeyList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [channels]
      operationId: createIngestKey
      summary: Issue one more ingest key
      description: |
        For a new build of the app, or to replace a leaked key without stopping the old
        builds at once. Up to 20 keys that are not revoked. The key is returned only here.
        Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIngestKeyRequest' }
      responses:
        '201':
          description: The key, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestKeyCreated' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`too_many_keys`: 20 keys are in use; revoke one first.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /channels/{id}/ingest-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/KeyId'
    delete:
      tags: [channels]
      operationId: revokeIngestKey
      summary: Revoke an ingest key
      description: |
        Reports with this key are refused from now on; reports already sent stay. Revoking
        a revoked key changes nothing. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Revoked.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /channels/{id}/identity-secret:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [channels]
      operationId: rotateIdentitySecret
      summary: Replace the secret that signs an app user's or a widget visitor's identity
      description: |
        App and widget channels. The old secret stops working at once: identity tokens and
        user hashes the company's backend signed with it are no longer accepted, and their
        reports and visitors come in as unconfirmed. The new
        secret is returned only here. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The new secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySecret' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/app-limits:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [channels]
      operationId: setAppLimits
      summary: Change the limits of an app channel
      description: |
        Within the platform's maximums: a file up to 25 MB, up to 5 files and 50 MB a report,
        files kept 1 to 365 days, a daily quota of reports and megabytes. Requires
        `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppLimits' }
      responses:
        '200':
          description: The channel with the new limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /channels/widget:
    post:
      tags: [channels]
      operationId: connectWidgetChannel
      summary: Connect a chat widget for a site or an app
      description: |
        Creates the «Виджет» channel with the pages that may embed it and
        the secret that signs a visitor's identity. The widget key is public — it
        goes into the page or the app — and is shown in the channel's details; the secret is
        returned only here and lives on the company's backend. Without `allowed_origins` the
        widget works nowhere yet. Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectWidgetChannelRequest' }
      responses:
        '201':
          description: The active channel and the identity secret, shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetChannelCreated' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ChannelsUnavailable' }

  /channels/{id}/widget-origins:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [channels]
      operationId: setWidgetOrigins
      summary: Change the pages that may embed a widget
      description: |
        Replaces the list. Pages of a removed origin lose their sessions within 30 seconds.
        Requires `channels.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetOriginsRequest' }
      responses:
        '200':
          description: The channel with the new list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/github:
    get:
      tags: [integrations]
      operationId: getGitHubIntegration
      summary: The workspace's GitHub integration
      description: |
        `integration` is `null` until a connection is started. `defaults` are the built-in
        templates (the issue template in the workspace language) for «reset». Requires
        `integrations.manage`.
      responses:
        '200':
          description: The integration, or none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubIntegrationState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [integrations]
      operationId: updateGitHubIntegration
      summary: Change the repository, labels or templates
      description: |
        Fields left out stay. A new repository is checked on GitHub: the App must be installed
        on it. A template equal to the built-in text, or empty, goes back to the built-in one.
        Requires `integrations.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGitHubIntegrationRequest' }
      responses:
        '200':
          description: The integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubIntegration' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GitHubConflict' }
        '422': { $ref: '#/components/responses/GitHubRefused' }
        '502': { $ref: '#/components/responses/GitHubUnavailable' }
    delete:
      tags: [integrations]
      operationId: disconnectGitHubIntegration
      summary: Disconnect GitHub
      description: |
        Forgets the App's key. An unfinished connection is removed; a working one is kept
        disabled for the issues linked to it. The App stays on GitHub: delete it there (its
        `url`). Requires `integrations.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Disconnected. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/github/manifest:
    post:
      tags: [integrations]
      operationId: startGitHubIntegration
      summary: Start connecting GitHub
      description: |
        Step 1 of 3. Returns the manifest of a new GitHub App: the browser posts `manifest` as
        the form field `manifest` to `post_url` (the user's account, or `organization`). GitHub
        creates the App and sends the browser to `/settings/integrations?github=created` with
        `code` and `state`. An unfinished earlier connection is replaced. Requires
        `integrations.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartGitHubIntegrationRequest' }
      responses:
        '201':
          description: The connection in `app_pending` and the manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubManifestStart' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/GitHubConflict' }
        '503': { $ref: '#/components/responses/IntegrationsUnavailable' }

  /integrations/github/app:
    post:
      tags: [integrations]
      operationId: completeGitHubApp
      summary: Finish creating the GitHub App
      description: |
        Step 2 of 3, with `code` and `state` from GitHub's redirect. The code is exchanged for
        the App's private key and webhook secret, which are encrypted. Then the App waits to
        be installed at `install_url`; GitHub sends the browser back to
        `/settings/integrations?github=installed` with `installation_id`. Requires
        `integrations.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteGitHubAppRequest' }
      responses:
        '200':
          description: The connection in `install_pending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubIntegration' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GitHubConflict' }
        '422': { $ref: '#/components/responses/GitHubRefused' }
        '502': { $ref: '#/components/responses/GitHubUnavailable' }
        '503': { $ref: '#/components/responses/IntegrationsUnavailable' }

  /integrations/github/installation:
    post:
      tags: [integrations]
      operationId: completeGitHubInstallation
      summary: Finish installing the GitHub App
      description: |
        Step 3 of 3, with `installation_id` from GitHub's redirect. Only an installation of
        this workspace's App is accepted. GitHub sends the browser back again when the
        repositories change later; that answers the integration as is. Requires
        `integrations.manage`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteGitHubInstallationRequest' }
      responses:
        '200':
          description: The active integration; pick the repository next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubIntegration' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GitHubConflict' }
        '422': { $ref: '#/components/responses/GitHubRefused' }
        '502': { $ref: '#/components/responses/GitHubUnavailable' }

  /integrations/github/repositories:
    get:
      tags: [integrations]
      operationId: listGitHubRepositories
      summary: Repositories the App is installed on
      description: |
        Up to 100, as GitHub lists them; `more` when there are others (type the name then).
        Requires `integrations.manage`.
      responses:
        '200':
          description: The repositories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubRepositoryList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GitHubConflict' }
        '422': { $ref: '#/components/responses/GitHubRefused' }
        '502': { $ref: '#/components/responses/GitHubUnavailable' }

  /integrations/github/issues:
    get:
      tags: [integrations]
      operationId: listOpenGitHubIssues
      summary: Open issues created or linked in the workspace
      description: |
        Up to 20, most recently linked first, one entry per issue: what "Link to an issue"
        offers, so complaints about one bug gather on one issue. Read from Tolkovo, not from
        GitHub. Empty when GitHub is not connected. Requires `issues.create`.
      responses:
        '200':
          description: The open issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenGitHubIssueList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ingest/reports:
    post:
      tags: [ingest]
      operationId: createIngestReport
      summary: Register a problem report and get upload links for its files
      description: |
        The body is limited by the channel's settings: up to 5 files (`413 too_many_files`),
        a file up to 25 MB (`413 file_too_large`), up to 50 MB a report (`413
        report_too_large`); allowed types are text, CSV, JSON, XML, ZIP, GZIP, PNG and JPEG
        (`415 unsupported_type`). A `.log` or `.txt` file may also come as `text/x-log` or
        `application/octet-stream`: it is taken as `text/plain`, so upload it with the
        headers of its link. Each upload link lives 15 minutes and fixes the size, the
        type and the SHA-256. `report_token` is shown once: send it to complete the report
        and, later, to read the replies and write back (`/replies`, `/messages`).

        With `contact.identity_token` = hex HMAC-SHA256 of `contact.external_id` under the
        channel's identity secret, signed by the company's backend, the contact is
        verified. A missing or wrong token makes an unverified contact, never an error:
        `contact_verified` says which.

        A retry with the same `Idempotency-Key` and body, before the report is completed,
        answers `200` with the same report, a new token (the first stops working) and fresh
        links.
      security:
        - ingestKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestReportRequest' }
      responses:
        '200':
          description: A retry with the same `Idempotency-Key` and body.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestReportCreated' }
        '201':
          description: Registered; upload the files next.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestReportCreated' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/InvalidIngestKey' }
        '409':
          description: '`report_submitted`: the `Idempotency-Key` names a report already completed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/ReportTooLarge' }
        '415':
          description: '`unsupported_type`: a file type is not allowed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`idempotency_key_reused`: the key was used with a different body.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/IngestLimited' }

  /ingest/reports/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ReportToken'
    post:
      tags: [ingest]
      operationId: completeIngestReport
      summary: Finish a report after its files are uploaded
      description: |
        Checks that every file is in storage with its declared size and submits the report;
        it then becomes a conversation. Completing twice answers `202` again. Another
        channel's report or a wrong token answers `404`. Rate: 30 a minute per IP.
      security:
        - ingestKey: []
      responses:
        '202':
          description: Submitted.
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/InvalidIngestKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`upload_incomplete`: a file is missing or of another size; `detail` names it.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/IngestLimited' }

  /ingest/reports/{id}/replies:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ReportToken'
    get:
      tags: [ingest]
      operationId: listIngestReportReplies
      summary: Replies to the app user, oldest first
      description: |
        What operators and the bot wrote to the user of the app in the report's conversation:
        no internal notes, no events of the conversation, no names of
        staff. Each file comes with a signed download request that lives 15 minutes; ask
        again for a fresh one. A reply shows up here a few seconds after it is sent.

        Poll when the app starts and at most once a minute while the report is open. Pass
        `cursor` of the answer as `since` next time; with `more` true, ask again at once.
        Until the report becomes a conversation the list is empty. Another channel's report
        or a wrong token answers `404`. Rate: 2 a minute per report, 120 a minute per IP.
      security:
        - ingestKey: []
      parameters:
        - name: since
          in: query
          description: '`cursor` of the previous answer; without it, from the first reply.'
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Replies after `since`, up to 50.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/ReportRateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/ReportRateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/ReportRateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestReplies' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/InvalidIngestKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/ReportLimited' }

  /ingest/reports/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ReportToken'
    post:
      tags: [ingest]
      operationId: postIngestReportMessage
      summary: The app user writes into the report's conversation
      description: |
        Text only, up to 10 000 characters. The message lands in the same conversation as a
        message of the customer; a resolved or closed conversation reopens. A
        retry with the same `Idempotency-Key` and text answers `200` with the first message.

        Before the report becomes a conversation the answer is `409 report_processing`: try
        again in a few seconds. Another channel's report or a wrong token answers `404`.
        Rate: 10 an hour per report, 120 a minute per IP.
      security:
        - ingestKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestMessageRequest' }
      responses:
        '200':
          description: A retry with the same `Idempotency-Key` and text.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/ReportRateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/ReportRateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/ReportRateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestMessage' }
        '201':
          description: Stored in the conversation.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/ReportRateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/ReportRateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/ReportRateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestMessage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/InvalidIngestKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`report_processing`: the report is not a conversation yet.'
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`idempotency_key_reused`: the key was used with a different text.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/ReportLimited' }

  /widget/session:
    post:
      tags: [widget]
      operationId: startWidgetSession
      summary: Start or continue a visitor's session in the widget
      description: |
        Called by the widget (`@tolkovo/widget`) on start and after `identify`. The page's
        `Origin` must be on the widget's list (`403 origin_not_allowed`); an Electron app
        loaded from a custom scheme sends `app://name`. Send the `session_token` the widget
        kept: if it still works it is returned again, otherwise a new one is.

        `user` is who the site or the app says the visitor is. With `user_hash` = hex
        HMAC-SHA256 of `external_id` under the widget's identity secret, signed by the
        company's backend, the visitor is verified and continues with the contact of that
        id — the same one their app reports land on. Without a valid hash it is a
        claim: a new unverified contact, never merged with others. A missing or wrong hash
        is not an error: `identity` says which. An anonymous visitor gets a contact only
        with the first message. Rate: 20 a minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetSessionRequest' }
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetSession' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401':
          description: '`invalid_widget_key`: the key is malformed or names no connected widget.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/WidgetOriginNotAllowed' }
        '429': { $ref: '#/components/responses/WidgetLimited' }
    delete:
      tags: [widget]
      operationId: endWidgetSession
      summary: End the visitor's session
      description: |
        The widget calls it when the visitor signs out of the site or the app, so the next
        person on the device starts afresh. Ending an ended session answers `204` too.
      security:
        - widgetSession: []
      responses:
        '204':
          description: Ended.
        '403': { $ref: '#/components/responses/WidgetOriginNotAllowed' }

  /widget/messages:
    get:
      tags: [widget]
      operationId: listWidgetMessages
      summary: The visitor's chat
      description: |
        The visitor's own messages and the replies of operators and the bot, oldest first:
        no internal notes, no events, no names of staff. Without `since`, the newest 100;
        with it, what came after. Messages of the last few seconds may come again with the
        next call — drop repeats by `id`. Fetch after `hello`, `widget.message` and
        `resync_required` of the realtime connection. Rate: 60 a minute per session.
      security:
        - widgetSession: []
      parameters:
        - name: since
          in: query
          description: '`cursor` of the previous answer.'
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Up to 100 messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetMessages' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/WidgetSessionEnded' }
        '403': { $ref: '#/components/responses/WidgetOriginNotAllowed' }
        '429': { $ref: '#/components/responses/WidgetLimited' }
    post:
      tags: [widget]
      operationId: sendWidgetMessage
      summary: The visitor writes
      description: |
        Text up to 10 000 characters, files uploaded with `POST /widget/uploads`, or both.
        Before the message is stored each file is checked: it must be uploaded whole, its
        first bytes must fit its type and, when the server has an antivirus, it must be
        clean. A file that fails is deleted and the message is refused with its
        `upload_id`; send the message again without it. The first message opens a
        conversation in the queue; a resolved one reopens. A retry with the same
        `Idempotency-Key` and text answers `200` with the first message. Rate: 30 a minute
        per session.
      security:
        - widgetSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetMessageRequest' }
      responses:
        '200':
          description: A retry with the same `Idempotency-Key` and text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetMessage' }
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetMessage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/WidgetSessionEnded' }
        '403': { $ref: '#/components/responses/WidgetOriginNotAllowed' }
        '409':
          description: |
            `attachment_not_uploaded`: a file is not in storage or not whole; `upload_id`
            names it. Upload it again with a new `POST /widget/uploads`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `idempotency_key_reused`: the key was used with a different text.
            `file_type_mismatch`: a file is not what its type says; `file_infected`: the
            antivirus found a threat. `upload_id` names the file, which is deleted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/WidgetLimited' }
        '503':
          description: '`scan_unavailable`: the antivirus does not answer; try again after `Retry-After`.'
          headers:
            Retry-After:
              description: Seconds until the next attempt.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /widget/uploads:
    post:
      tags: [widget]
      operationId: createWidgetUpload
      summary: Register a visitor's file and get a signed upload request
      description: |
        Up to 10 MB: PNG, JPEG, GIF, WebP, PDF, text, CSV, JSON, ZIP, DOCX and XLSX. Upload
        the file with exactly the returned method, URL and headers, then send its `id`
        in `attachment_ids` of `POST /widget/messages`, at most 5 per message. The upload
        request works once and lives 15 minutes; a file no message took is deleted after
        an hour. With the `s3` driver the request goes to the bucket, which must allow
        `PUT` from the widget's origins (CORS). Rate: 20 an hour per session, 60 per IP.
      security:
        - widgetSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetUploadRequest' }
      responses:
        '201':
          description: Registered; upload the file next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetUpload' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/WidgetSessionEnded' }
        '403': { $ref: '#/components/responses/WidgetOriginNotAllowed' }
        '429': { $ref: '#/components/responses/WidgetLimited' }

  /widget/contact:
    post:
      tags: [widget]
      operationId: submitWidgetContact
      summary: The visitor fills in the pre-chat form
      description: |
        What the visitor typed about themselves (the widget's `prechat` option) and their
        consent to the processing of personal data. Which fields the form asks for and which
        are required is set in the widget's code; send only what was filled in. Before the
        first message the values wait in the session and go onto the contact with that
        message; later they fill what the contact lacks (a typed name replaces the guest
        name) and never overwrite what an operator entered. Typed values are claims: the
        contact becomes `unverified`, the next `POST /widget/session` says so, and it is never
        merged with others. A verified contact keeps its values and takes only the consent,
        stored with the policy URL and the time. Rate: 10 a minute per session.
      security:
        - widgetSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetContactRequest' }
      responses:
        '204':
          description: Kept.
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/WidgetSessionEnded' }
        '403': { $ref: '#/components/responses/WidgetOriginNotAllowed' }
        '429': { $ref: '#/components/responses/WidgetLimited' }

  /widget/receipts:
    post:
      tags: [widget]
      operationId: markWidgetReceipt
      summary: The widget received or showed replies
      description: |
        `delivered_up_to`: the widget has the replies up to this message; `read_up_to`: it
        showed them in an open, visible chat. The operator sees «delivered» and «read» on
        each reply (`message.delivery`). A status never moves back. Rate: 60 a minute per
        session.
      security:
        - widgetSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetReceiptRequest' }
      responses:
        '204':
          description: Recorded.
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/WidgetSessionEnded' }
        '403': { $ref: '#/components/responses/WidgetOriginNotAllowed' }
        '429': { $ref: '#/components/responses/WidgetLimited' }

  /files/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: |
          Object key `ws/{workspace_id}/{kind}/{uuid}`. It spans several path
          segments: the slashes are sent unescaped.
        schema: { type: string }
      - name: exp
        in: query
        required: true
        description: Expiry of the link, Unix seconds.
        schema: { type: integer, format: int64 }
      - name: sig
        in: query
        required: true
        description: HMAC signature over the method, the key and every other query parameter.
        schema: { type: string }
    get:
      tags: [files]
      operationId: downloadFile
      summary: Download a file by a signed link
      security: []
      parameters:
        - name: type
          in: query
          description: Content type to answer with; `application/octet-stream` when absent.
          schema: { type: string }
        - name: name
          in: query
          description: File name for `Content-Disposition`.
          schema: { type: string }
      responses:
        '200':
          description: |
            The file, always as an attachment (`Content-Disposition`, `nosniff`, sandbox CSP,
            `Cache-Control: private, no-store`). Range and conditional requests are supported.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content for a `Range` request.
        '403': { $ref: '#/components/responses/LinkRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [files]
      operationId: uploadFile
      summary: Upload a file by a signed link
      description: |
        The link decides the key, the size limits, the digest and the content type; the
        request only supplies the bytes. Each upload link works once. Pages of any origin
        may send it (CORS without credentials): the signature is the permission, so the
        widget uploads from a company's site.
      security: []
      parameters:
        - name: max
          in: query
          required: true
          description: Largest accepted body, bytes.
          schema: { type: integer, format: int64 }
        - name: size
          in: query
          description: Exact body size, bytes, when the link fixes it.
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          description: Required `Content-Type` of the request when present.
          schema: { type: string }
        - name: sha256
          in: query
          description: Hex SHA-256 the body must match when present.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored (an empty body, as S3 answers a PUT).
        '400':
          description: '`size_mismatch` or `checksum_mismatch`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/LinkRejected' }
        '408':
          description: '`upload_timeout`: the client was too slow; nothing was stored.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`already_uploaded`: the link has been used.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: '`file_too_large`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: '`content_type_mismatch`: `Content-Type` differs from the link.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: The inbox, most recent activity first
      description: Requires `conversations.view` (owner, admin, operator).
      parameters:
        - name: status
          in: query
          description: Any of these statuses; repeat the parameter for several. All when absent.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/ConversationStatus' }
        - name: assignee
          in: query
          description: '`me`, `none` (unassigned) or a member''s user id.'
          schema: { type: string }
        - name: contact_id
          in: query
          description: |
            Only this contact's conversations: the history in the customer card. An unknown id
            gives an empty page.
          schema:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of conversations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Start a conversation with an existing contact
      description: |
        Requires `conversations.create` (owner, admin). The conversation enters the
        queue (`queued`) at once. Channels create theirs from inbound messages.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations/counts:
    get:
      tags: [conversations]
      operationId: getInboxCounts
      summary: Counters of the inbox tabs for the caller
      description: Requires `conversations.view`.
      responses:
        '200':
          description: The counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxCounts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [conversations]
      operationId: getConversation
      summary: One conversation
      description: Requires `conversations.view`.
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [conversations]
      operationId: changeConversationStatus
      summary: Move the conversation along the state machine
      description: |
        Requires `conversations.reply`; without `conversations.manage` only for a
        conversation assigned to the caller. Moving to `queued` releases the assignee;
        `assigned` is reachable only when the conversation already has an assignee
        (otherwise use `PUT /conversations/{id}/assignee`).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStatusRequest' }
      responses:
        '200':
          description: The changed conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /conversations/{id}/assignee:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [conversations]
      operationId: assignConversation
      summary: Assign, transfer or release the conversation
      description: |
        `conversations.take` allows taking an unassigned conversation for yourself and
        releasing (`assignee_id: null`) or transferring your own; `conversations.assign`
        (owner, admin) allows any assignment. The assignee must be an active member of the workspace.
        `queued` and `resolved` become `assigned`; `assigned` and `pending` keep their
        status (transfer); releasing makes an `assigned` conversation `queued`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRequest' }
      responses:
        '200':
          description: The changed conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [conversations]
      operationId: listMessages
      summary: The conversation feed, newest first
      description: Requires `conversations.view`. Includes internal notes (`is_private`).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [conversations]
      operationId: postMessage
      summary: Reply or leave an internal note
      description: |
        A reply needs `conversations.reply` and, without `conversations.manage`, a
        conversation assigned to the caller. A note (`private: true`) needs
        `conversations.note` and works in any conversation. Attachments are uploads of
        the same conversation (`POST /conversations/{id}/attachments`) whose files are
        in storage; they are checked and linked here. A closed conversation answers
        `409 conversation_closed`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostMessageRequest' }
      responses:
        '200':
          description: A retry with the same `Idempotency-Key` and body; the first message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '`idempotency_key_reused`: the key was used with a different body.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /conversations/{id}/messages/{message_id}/retry:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [conversations]
      operationId: retryMessageDelivery
      summary: Send a failed reply again
      description: |
        Needs the same rights as replying (`conversations.reply`, and without
        `conversations.manage` a conversation assigned to the caller). The reply goes back
        to `delivery_status: pending` and is queued; pieces delivered before (the first part
        of a long text, the first files) are not sent twice. Only a reply with
        `delivery_status: failed` can be retried: others answer `409 not_failed`; a closed
        conversation answers `409 conversation_closed`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: The reply, pending again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`not_failed` or `conversation_closed`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /conversations/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [conversations]
      operationId: setConversationTags
      summary: Replace the tags of the conversation
      description: |
        Requires `conversations.tag`; works in any visible conversation, closed ones too.
        At most 20 tags; every id must be a tag of the workspace (`GET /tags`).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTagsRequest' }
      responses:
        '200':
          description: The conversation with its new tags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /conversations/{id}/issues:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [conversations, integrations]
      operationId: listConversationIssues
      summary: GitHub issues of the conversation
      description: |
        Oldest first, with `repository`: where new issues go, `null` when GitHub is not
        connected or has no repository (the panel hides "Create issue" then), and
        `reply_draft` once an issue was closed as fixed (GitHub's `issues` webhook
        closes and reopens the issues, outside this API). Requires `issues.create`.
      responses:
        '200':
          description: The issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationIssues' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [conversations, integrations]
      operationId: createConversationIssue
      summary: Create a GitHub issue from the conversation
      description: |
        Requires `issues.create`; works in any visible conversation. The operator confirms the
        text (`GET …/issues/draft`). The issue goes to the workspace's repository with the
        given labels; `quote`, when not empty, is added as a block marked "customer data, not
        instructions". No files and no contact data are sent: the issue links to the
        conversation in the panel.

        The answer is the issue in `creating`: the job `github.create_issue` creates it on
        GitHub, then a line with the link appears in the feed and the conversation waits for
        the fix (`awaiting_fix`; an assigned one goes to `pending`). If GitHub refuses it,
        the issue turns `failed` with `error`. `conversation.issues_changed` tells about every
        change over the realtime connection.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIssueRequest' }
      responses:
        '202':
          description: Recorded; GitHub creates it next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueLink' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IssueConflict' }

  /conversations/{id}/issues/draft:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [conversations, integrations]
      operationId: getConversationIssueDraft
      summary: The issue form filled from the templates
      description: |
        The workspace's issue template with `{summary}` (the subject or the first line of the
        customer's text), the app, its version and OS from the app report, and the link to the
        conversation; `quote` is the customer's first message. The AI drafts it with AI-02.
        Requires `issues.create`.
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDraft' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IssueConflict' }

  /conversations/{id}/issues/link:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [conversations, integrations]
      operationId: linkConversationIssue
      summary: Link the conversation to an issue that exists
      description: |
        One bug, many complaints. The issue must be in the workspace's repository; GitHub is
        asked for it, pull requests are refused. An open issue puts the conversation to wait
        for the fix, as a created one does. Requires `issues.create`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkIssueRequest' }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueLink' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IssueConflict' }
        '422': { $ref: '#/components/responses/IssueRefused' }
        '502': { $ref: '#/components/responses/GitHubUnavailable' }

  /conversations/{id}/issues/{issue_id}/retry:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IssueId'
    post:
      tags: [conversations, integrations]
      operationId: retryConversationIssue
      summary: Send an issue GitHub refused again
      description: |
        Only a `failed` issue (`409 issue_state` otherwise), through the integration it was
        created with (`409 github_not_connected` after GitHub was reconnected: create it anew).
        Requires `issues.create`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: Queued again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IssueConflict' }

  /conversations/{id}/issues/{issue_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IssueId'
    delete:
      tags: [conversations, integrations]
      operationId: dismissConversationIssue
      summary: Remove an issue GitHub refused
      description: Only a `failed` issue (`409 issue_state` otherwise). Requires `issues.create`.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Removed.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IssueConflict' }

  /conversations/{id}/read:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [conversations]
      operationId: markConversationRead
      summary: Mark the conversation read up to a message for the caller
      description: |
        Requires `conversations.view`. Read marks are per member and only move forward:
        an older message than the current mark changes nothing. A move sends
        `conversation.read` over the realtime connection.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkReadRequest' }
      responses:
        '204':
          description: Marked, or the mark was already further.
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [conversations]
      operationId: createAttachmentUpload
      summary: Register a file and get a signed upload request
      description: |
        Requires `conversations.reply` or `conversations.note`. The server picks an
        unpredictable key `ws/{workspace_id}/conv/{uuid}` and signs a PUT
        that fixes the size, the content type and, when given, the SHA-256. Upload the
        file with exactly the returned method, URL and headers, then send the attachment
        id with a message. Up to 25 MB; images, PDF, text, CSV, JSON, ZIP, GZIP and
        Office documents.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '201':
          description: Registered; upload the file next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUpload' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attachments/{id}/download-link:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [conversations]
      operationId: getAttachmentDownloadLink
      summary: A short-lived signed download request for a sent attachment
      description: Requires `conversations.view`. Attachments not yet sent with a message answer `404`.
      responses:
        '200':
          description: The signed request (15 minutes by default).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tags:
    get:
      tags: [conversations]
      operationId: listTags
      summary: Every tag of the workspace, by name
      description: Requires `conversations.view`. At most 500, so there are no pages.
      responses:
        '200':
          description: The tags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [conversations]
      operationId: createTag
      summary: Create a tag
      description: |
        Requires `tags.manage` (owner, admin). Names are unique in the workspace without
        regard to case; a taken name answers `409 tag_exists`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`tag_exists`: a tag with this name exists.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      summary: Contacts, newest first
      description: Requires `contacts.view` (owner, admin, operator).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of contacts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [contacts]
      operationId: createContact
      summary: Add a contact
      description: Requires `contacts.edit` (owner, admin, operator).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [contacts]
      operationId: getContact
      summary: One contact
      description: Requires `contacts.view`.
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [contacts]
      operationId: updateContact
      summary: Change a contact
      description: |
        Requires `contacts.edit`. Absent fields stay as they are; an empty `email`,
        `phone` or `locale` clears it.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '200':
          description: The changed contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    ReportToken:
      name: X-Report-Token
      in: header
      required: true
      description: '`report_token` from the answer that created the report.'
      schema: { type: string, minLength: 1, maxLength: 128 }
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import: { path: github.com/google/uuid }
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import: { path: github.com/google/uuid }
    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import: { path: github.com/google/uuid }
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import: { path: github.com/google/uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` of the previous page.
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      description: Page size, 1–100; 50 when absent.
      schema: { type: integer, minimum: 1, maximum: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes a retry return the first result instead of acting twice. A
        reused key with a different body answers `422`.
      schema: { type: string, minLength: 1, maxLength: 255 }

  securitySchemes:
    widgetSession:
      type: http
      scheme: bearer
      description: A widget session token, `tk_wsess_…`, from `POST /widget/session`.
    ingestKey:
      type: http
      scheme: bearer
      description: An ingest key of an app channel, `tk_ingest_…`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: tolkovo_session
      description: '`__Host-tolkovo_session` outside development.'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: '`csrf_token` of the current session. Required on every unsafe method.'

  headers:
    RateLimitLimit:
      description: Reports allowed per hour for the ingest key.
      schema: { type: integer }
    RateLimitRemaining:
      description: Reports left in the current hour.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the hour starts over.
      schema: { type: integer }
    ReportRateLimitLimit:
      description: Requests to this endpoint allowed per window for the report.
      schema: { type: integer }
    ReportRateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    ReportRateLimitReset:
      description: Seconds until the window starts over.
      schema: { type: integer }
    SetSessionCookie:
      description: The session cookie (`HttpOnly; SameSite=Lax; Path=/`, `Secure` outside development).
      schema: { type: string }

  responses:
    Invalid:
      description: '`invalid_request`: malformed JSON, unknown fields or invalid values.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: '`unauthenticated` (no or expired session) or `invalid_credentials` (login).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden` (missing permission), `csrf_failed`, `cross_origin` or `no_workspace`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`not_found`, also for resources of other workspaces.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LinkRejected:
      description: '`link_invalid` (bad signature or parameters) or `link_expired`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        `invalid_transition` (the state machine forbids it), `version_conflict` (the
        conversation changed since `version`), `conversation_closed` or
        `attachment_not_uploaded` (the file of an attachment is not in storage).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidToken:
      description: '`invalid_token`: the link is unknown, used, revoked or expired.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EmailDisabled:
      description: '`email_disabled`: outgoing email is not configured on this server.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: '`too_many_requests`; see `Retry-After`.'
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    InvalidIngestKey:
      description: '`invalid_key`: the ingest key is missing, malformed, unknown or revoked.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ReportTooLarge:
      description: |
        `too_many_files`, `file_too_large` or `report_too_large`: the report breaks a limit
        of the channel; `detail` gives it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IngestLimited:
      description: |
        `too_many_requests` (a rate per IP or key) or `daily_quota_exceeded` (the channel's
        reports or megabytes for the UTC day).
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WidgetSessionEnded:
      description: |
        `widget_session_ended`: the token is unknown, expired or ended, or the widget was
        disconnected. Start a new session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WidgetOriginNotAllowed:
      description: '`origin_not_allowed`: the page''s `Origin` is not on the widget''s list.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WidgetLimited:
      description: '`too_many_requests`: a rate per IP or session.'
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ReportLimited:
      description: '`too_many_requests`: the rate of this endpoint for the report or the IP.'
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ChannelExists:
      description: '`channel_exists`: this bot or account is a channel already, here or in another workspace.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LoginStep:
      description: |
        `login_step` (the login is finished, cancelled or waits for another step) or
        `login_expired` (more than 15 minutes since the phone was entered: start again).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TelegramLoginRejected:
      description: |
        Telegram refused the login: `telegram_phone_invalid`, `telegram_no_account` (no
        Telegram account for the number), `telegram_banned`, `telegram_code_invalid`,
        `telegram_code_expired` or `telegram_password_invalid`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TelegramUnavailable:
      description: '`telegram_unavailable`: Telegram could not be reached or answered unexpectedly.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GitHubConflict:
      description: |
        `github_connected` (GitHub is already connected: disconnect it first), `github_step`
        (the connection is not waiting for this step: reload it) or `github_state` (the GitHub
        redirect belongs to another connection or is older than an hour: start again).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GitHubRefused:
      description: |
        `github_code_expired` (the code from GitHub was used or is older than an hour: start
        again), `github_installation_invalid` (not an installation of this workspace's App),
        `github_repository_unreachable` (the App is not installed on the repository) or
        `github_app_refused` (GitHub refused the App: it was deleted or its key revoked;
        disconnect and connect again).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GitHubUnavailable:
      description: '`github_unavailable`: GitHub could not be reached or answered unexpectedly.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IssueConflict:
      description: |
        `github_not_connected` (GitHub is not connected or has no repository picked),
        `issue_in_progress` (an issue of this conversation is being created),
        `issue_linked` (the conversation is linked to this issue already) or `issue_state`
        (only a failed issue can be sent again or removed).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IssueRefused:
      description: |
        `issue_not_found` (the repository has no issue with this number, or it is a pull
        request) or `github_app_refused` (GitHub refused the App: it was deleted or its key
        revoked).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IntegrationsUnavailable:
      description: '`encryption_unavailable`: `TOLKOVO_MASTER_KEY` is not set, the App''s key cannot be stored.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ChannelsUnavailable:
      description: |
        `encryption_unavailable` (`TOLKOVO_MASTER_KEY` is not set, secrets cannot be stored)
        or `telegram_user_unavailable` (no Telegram application for personal accounts:
        `TOLKOVO_TELEGRAM_API_ID`, `TOLKOVO_TELEGRAM_API_HASH`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Stable machine-readable error code. }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        upload_id:
          type: string
          description: The widget's file a message was refused for.

    Locale:
      type: string
      enum: [ru, en]

    Role:
      type: string
      description: System role in phase 1.
      enum: [owner, admin, operator]

    RegistrationState:
      type: object
      required: [open]
      properties:
        open: { type: boolean, description: '`POST /auth/register` would be accepted now.' }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name, workspace_name, workspace_slug]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: '#/components/schemas/Locale' }
        workspace_name: { type: string, minLength: 1, maxLength: 120 }
        workspace_slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
        timezone:
          type: string
          description: IANA time zone; defaults to Europe/Moscow.
          maxLength: 64

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }

    SwitchWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }

    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: '#/components/schemas/Locale' }
        timezone: { type: string, maxLength: 64 }

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: Trimmed; 1–120 characters after trimming. }
        locale:
          $ref: '#/components/schemas/Locale'
          description: Interface language of the panel.

    EmailDelayMinutes:
      type: integer
      enum: [5, 15, 30, 60]
      description: How long customer messages may stay unread before the email goes out.

    NotificationSettings:
      type: object
      required: [email_missed, email_delay_minutes, email_available]
      properties:
        email_missed:
          type: boolean
          description: |
            Email the user when a conversation assigned to them keeps unread customer messages
            for `email_delay_minutes`. Goes only to a confirmed email (`User.email_verified`),
            without message texts. On by default.
        email_delay_minutes: { $ref: '#/components/schemas/EmailDelayMinutes' }
        email_available:
          type: boolean
          description: Outgoing email is configured on this server; without it nothing is sent.

    UpdateNotificationSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        email_missed: { type: boolean }
        email_delay_minutes: { $ref: '#/components/schemas/EmailDelayMinutes' }

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128 }

    DeviceSession:
      type: object
      description: |
        One signed-in browser of the user. The `id` is a public random
        identifier, not the session token.
      required: [id, created_at, last_seen_at, user_agent, current]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        created_at: { type: string, format: date-time, description: When the session started. }
        last_seen_at:
          type: string
          format: date-time
          description: Last request; recorded at most every 5 minutes.
        user_agent:
          type: string
          maxLength: 200
          description: '`User-Agent` at sign-in, shortened; empty when the client sent none.'
        current: { type: boolean, description: This is the session of the request. }

    DeviceSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceSession' }

    User:
      type: object
      required: [id, email, name, locale, email_verified]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        email: { type: string }
        name: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        email_verified:
          type: boolean
          description: |
            The user proved they own the email: the confirmation link, an accepted
            invitation or a password reset.

    Workspace:
      type: object
      required: [id, slug, name, locale, timezone]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        slug: { type: string }
        name: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        timezone: { type: string }

    WorkspaceSummary:
      type: object
      required: [id, slug, name, role]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceSummary' }

    Session:
      type: object
      required: [user, workspace, role, permissions, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        workspace: { $ref: '#/components/schemas/Workspace' }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          description: Permissions of the role in this workspace, sorted.
          items: { type: string }
        csrf_token:
          type: string
          description: Send it as `X-CSRF-Token` on unsafe requests.

    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 200, description: The fragment of the emailed link. }

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 128 }

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        password:
          type: string
          maxLength: 128
          description: The new account's password (8–128), or the existing account's one.
        name:
          type: string
          maxLength: 120
          description: Required when no account exists for the invited email.
        locale:
          $ref: '#/components/schemas/Locale'
          description: Interface language of a new account; the workspace's when absent.

    InvitationPreview:
      type: object
      required: [workspace_name, email, role, expires_at, account_exists]
      properties:
        workspace_name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        expires_at: { type: string, format: date-time }
        account_exists:
          type: boolean
          description: An account with this email exists; accept with its password.

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, maxLength: 254 }
        role:
          type: string
          enum: [admin, operator]

    Invitation:
      type: object
      required: [id, email, role, invited_by_name, expires_at, created_at, expired]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        invited_by_name:
          type: string
          description: Empty when the inviter's account is gone.
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        expired: { type: boolean }

    InvitationSent:
      type: object
      required: [invitation]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        invite_url:
          type: string
          description: |
            Present only when the server cannot send email: the link to pass on. It is
            shown once; resend issues a new one.

    InvitationList:
      type: object
      required: [items, email_enabled]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        email_enabled:
          type: boolean
          description: The server emails invitations; otherwise the panel shows the link.

    Member:
      type: object
      required: [user_id, email, name, role, active, presence]
      properties:
        user_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        presence: { $ref: '#/components/schemas/Presence' }

    Presence:
      type: string
      description: |
        `online` accepts conversations, `away` does not; both with the panel open.
        `offline`: the panel has not been open for about 90 seconds.
      enum: [online, away, offline]

    MyPresence:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: What the user chose; `offline` follows from a closed panel.
          enum: [online, away]

    RoutingSettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          description: |
            `manual`: operators take conversations from the queue. `round_robin`: the server
            assigns them in turn to members who are `online`.
          enum: [manual, round_robin]

    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }

    ConversationStatus:
      type: string
      description: State of a conversation.
      enum: [new, bot, queued, assigned, pending, resolved, closed]

    ContactRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        name: { type: string }

    Conversation:
      type: object
      required: [id, number, status, priority, line_level, contact, assignee_id, channel_id, subject,
                 first_response_at, last_message_at, resolved_at, closed_at, awaiting_fix, version, created_at,
                 updated_at, last_message, tag_ids, last_read_message_id, unread_count]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        number: { type: integer, format: int64, description: Human-readable number inside the workspace. }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        priority: { type: integer, minimum: 0, maximum: 3 }
        line_level: { type: integer, minimum: 1, maximum: 3 }
        contact: { $ref: '#/components/schemas/ContactRef' }
        assignee_id:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        channel_id:
          type: [string, 'null']
          description: '`null` for conversations started from the panel or API.'
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        subject: { type: [string, 'null'] }
        first_response_at: { type: [string, 'null'], format: date-time }
        last_message_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        awaiting_fix:
          type: boolean
          description: |
            An open GitHub issue is linked to the conversation: it waits for the fix
            and does not resolve itself by inactivity. The inbox marks it.
        version:
          type: integer
          description: Bumps on every change; send it back to detect concurrent edits.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_message:
          description: |
            The newest message the customer could see, for the inbox list: internal notes and
            system events are skipped. `null` until there is one.
          oneOf:
            - $ref: '#/components/schemas/ConversationPreview'
            - type: 'null'
        tag_ids:
          type: array
          maxItems: 20
          description: Tags in the order they were added; names and colors are in `GET /tags`.
          items:
            type: string
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }
        last_read_message_id:
          type: [string, 'null']
          description: The caller's read mark; `null` when they have not read the conversation.
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        unread_count:
          type: integer
          minimum: 0
          maximum: 100
          description: Customer messages after the caller's read mark, counted up to 100.

    ConversationPreview:
      type: object
      required: [sender_type, kind, text, attachments, created_at]
      properties:
        sender_type: { type: string, enum: [contact, operator, bot, system] }
        kind: { type: string, enum: [text, media] }
        text:
          type: string
          maxLength: 200
          description: The start of the message on one line; empty when it has only files.
        attachments: { type: integer, minimum: 0, description: Number of attached files. }
        created_at: { type: string, format: date-time }

    InboxCounts:
      type: object
      description: |
        Counters of the inbox tabs. `mine`: assigned to the caller, `assigned` or `pending`;
        `mine_unread`: of those, with customer messages after the caller's read mark (the
        counter in the tab title); `unassigned`: `queued`; `open`: every status before
        `resolved`.
      required: [mine, mine_unread, unassigned, open]
      properties:
        mine: { type: integer, format: int64, minimum: 0 }
        mine_unread: { type: integer, format: int64, minimum: 0 }
        unassigned: { type: integer, format: int64, minimum: 0 }
        open: { type: integer, format: int64, minimum: 0 }

    ConversationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_cursor:
          type: [string, 'null']
          description: Cursor of the next page; `null` on the last one.

    CreateConversationRequest:
      type: object
      additionalProperties: false
      required: [contact_id]
      properties:
        contact_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        subject: { type: string, maxLength: 200 }
        priority: { type: integer, minimum: 0, maximum: 3 }

    ChangeStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ConversationStatus' }
        version:
          type: integer
          description: When set, must equal the current version, otherwise `409 version_conflict`.

    AssignRequest:
      type: object
      additionalProperties: false
      required: [assignee_id]
      properties:
        assignee_id:
          type: [string, 'null']
          description: The member to assign; `null` releases the conversation to the queue.
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        version:
          type: integer
          description: When set, must equal the current version, otherwise `409 version_conflict`.

    Attachment:
      type: object
      required: [id, file_name, content_type, size, status]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        file_name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        status:
          type: string
          enum: [uploading, scanning, ready, rejected, expired]

    Message:
      type: object
      required: [id, conversation_id, direction, sender_type, sender_id, kind, body, is_private,
                 delivery_status, attachments, event, created_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        conversation_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        direction: { type: string, enum: [in, out] }
        sender_type: { type: string, enum: [contact, operator, bot, system] }
        sender_id:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        kind: { type: string, enum: [text, media, note, event] }
        body: { type: string }
        is_private: { type: boolean, description: Internal note; never shown to the customer. }
        delivery_status:
          type: [string, 'null']
          description: |
            `pending`, `sent`, `delivered`, `read` or `failed`; `null` when there is nothing
            to deliver (notes, conversations without a channel). A reply in a Telegram
            conversation is `pending` until the channel sends it, then `sent`; a personal
            account also reports `read` when the customer opens the chat (a bot cannot).
            Changes come as `message.delivery` over the realtime connection.
        delivery_error:
          type: string
          enum: [blocked, chat_not_found, limited, rejected, channel_unavailable, failed]
          description: |
            Why a reply was not delivered; present only with `delivery_status: failed`.
            `blocked`: the customer blocked the bot or the account. `chat_not_found`: the
            chat or the customer's account is gone, or the personal account cannot address
            them. `limited`: Telegram restricted the account from writing. `rejected`:
            Telegram refused this message (size, format). `channel_unavailable`: the channel
            is disconnected or needs the admin. `failed`: Telegram stayed unreachable
            through every retry (about 40 minutes); `POST …/retry` sends it again.
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        event:
          description: |
            What a system message (`kind: event`) records; `null` for other kinds. The body of
            a system message is empty: clients render the line in the reader's language.
            For `sender_type: system` `sender_id` is the member who acted, `null` for the
            system itself.
          oneOf:
            - $ref: '#/components/schemas/MessageEvent'
            - type: 'null'
        unsupported:
          type: string
          enum: [sticker, location, contact, poll, other]
          description: |
            Set on a customer message from a channel that holds something the panel does not
            show (a sticker, a location…) instead of text and files; absent otherwise.
        sent_outside_panel:
          type: boolean
          description: |
            `true` on an operator message the owner of a personal Telegram account wrote in
            their own Telegram app (`sender_id` is `null`); absent otherwise.
        report: { $ref: '#/components/schemas/MessageReport' }
        created_at: { type: string, format: date-time }

    MessageReport:
      type: object
      description: |
        Set on a customer message that is a problem report from a company app;
        absent otherwise. What the app said about itself and how its files were checked.
      required: [report_id, app, contact_verified, files]
      properties:
        report_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        app: { $ref: '#/components/schemas/IngestApp' }
        contact_verified:
          type: boolean
          description: The company's backend signed the user's id; otherwise the contact is new and unverified.
        files:
          type: array
          description: |
            The check of each file, in the order of `attachments`: `ok`, `type_mismatch` (the
            bytes are not the declared type), `infected`, `not_scanned` (the antivirus stayed
            unreachable), `missing`. Every value but `ok` comes with a `rejected` attachment.
          items:
            type: string
            enum: [ok, type_mismatch, infected, not_scanned, missing]

    MessageEvent:
      type: object
      required: [type, from, to, assignee_id, previous_assignee_id]
      properties:
        type:
          type: string
          enum: [status_changed, assigned, issue_created, issue_linked, issue_closed, issue_reopened]
          description: |
            `assigned` covers taking, transferring and releasing. `issue_created` and
            `issue_linked`: a GitHub issue was created from the conversation or it was linked to
            one, with `issue`; `from` and `to` differ when the conversation went to wait for the
            fix with it. `issue_closed` (with `issue.reason`) and `issue_reopened`: GitHub
            closed or reopened a linked issue; `from` and `to` differ when a fixed issue brought
            the conversation back to its assignee (`pending → assigned`) or to the queue, or a
            reopened one put it to wait for the fix again.
        from: { $ref: '#/components/schemas/ConversationStatus' }
        to: { $ref: '#/components/schemas/ConversationStatus' }
        assignee_id:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        previous_assignee_id:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        issue: { $ref: '#/components/schemas/MessageEventIssue' }

    MessageEventIssue:
      type: object
      required: [link_id, repository, number, url]
      properties:
        link_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        repository: { type: string }
        number: { type: integer, format: int64 }
        url: { type: string }
        reason:
          type: string
          enum: [completed, not_planned]
          description: |
            Only with `issue_closed`: `completed` (fixed; the reply about the fix is drafted,
            `ConversationIssues.reply_draft`) or `not_planned` (won't be fixed, a duplicate).

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { $ref: '#/components/schemas/TagColor' }

    TagColor:
      type: string
      enum: [gray, teal, amber, red, violet, blue, green]
      description: A palette key of the panel, readable in both themes.

    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Spaces are collapsed; must contain more than spaces.
        color: { $ref: '#/components/schemas/TagColor' }

    SetTagsRequest:
      type: object
      additionalProperties: false
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }
        version:
          type: integer
          description: When set, must equal the current version, otherwise `409 version_conflict`.

    MarkReadRequest:
      type: object
      additionalProperties: false
      required: [up_to_message_id]
      properties:
        up_to_message_id:
          type: string
          description: The newest message the caller has seen; a message of this conversation.
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }

    MessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor: { type: [string, 'null'] }

    PostMessageRequest:
      type: object
      additionalProperties: false
      properties:
        body: { type: string, maxLength: 10000, description: Plain text; may be empty when attachments are sent. }
        private: { type: boolean, description: Internal note instead of a reply. }
        attachment_ids:
          type: array
          maxItems: 10
          items:
            type: string
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }

    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [file_name, content_type, size]
      properties:
        file_name: { type: string, minLength: 1, maxLength: 1024 }
        content_type: { type: string, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1, maximum: 26214400 }
        sha256:
          type: string
          description: Hex SHA-256 of the file; the storage then rejects any other content.
          pattern: '^[0-9a-f]{64}$'

    SignedRequest:
      type: object
      required: [method, url, headers, expires_at]
      properties:
        method: { type: string }
        url: { type: string }
        headers:
          type: object
          description: Headers to send exactly as given.
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }

    AttachmentUpload:
      type: object
      required: [attachment, upload]
      properties:
        attachment: { $ref: '#/components/schemas/Attachment' }
        upload: { $ref: '#/components/schemas/SignedRequest' }

    Contact:
      type: object
      required: [id, name, name_placeholder, email, phone, locale, identity, created_at, updated_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        name: { type: string, description: Never empty. }
        name_placeholder:
          type: boolean
          description: >-
            `name` is the guest name the server gave a contact that came without one
            («Гость 4821» / «Guest 4821», in the workspace's language). A name the visitor types later
            or an operator enters replaces it; saving an empty name brings it back.
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        locale: { type: [string, 'null'], description: '`ru`, `en` or `null`.' }
        identity:
          type: string
          enum: [verified, unverified, none]
          description: >-
            `verified` — the company's backend signed the user's id (site widget or app report),
            conversations of that user from every channel land on this contact. `unverified` — the
            visitor or app user said who they are without a valid signature: name and email are
            only what they typed, and the contact is never merged with others. `none` — no claim
            (Telegram, created by an operator, an anonymous visitor). The id itself is not returned.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContactPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        next_cursor: { type: [string, 'null'] }

    ContactInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        locale:
          type: string
          description: '`ru` or `en`; empty clears it on update.'
          maxLength: 2

    ChannelType:
      type: string
      description: '`app` — reports from a company app; `widget` — a chat on a site or in an app.'
      enum: [telegram_bot, telegram_user, app, widget]

    ChannelStatus:
      type: string
      description: |
        `pending` — a personal-account login in progress; `active` — works; `error` — needs
        the admin, `error_code` says why: `token_revoked` (the bot's token was revoked in
        @BotFather), `session_revoked` (the session was ended in Telegram), `banned` (Telegram
        blocked the account). The admin disconnects the channel and connects it again.
      enum: [pending, active, error]

    ChannelDetails:
      type: object
      description: What may be shown about the channel. Never secrets.
      required: [username, display_name, phone_masked]
      properties:
        username: { type: [string, 'null'], description: 'Without "@".' }
        display_name: { type: [string, 'null'], description: The bot's or the account's name in Telegram. }
        phone_masked: { type: [string, 'null'], description: 'Personal accounts: e.g. "+79•••••••67".' }
        delivery:
          type: string
          description: 'Bots only: Telegram pushes updates to a webhook, or the worker polls.'
          enum: [webhook, polling]
        app_limits: { $ref: '#/components/schemas/AppLimits' }
        widget_key:
          type: string
          description: 'Widgets only: the public key, `tk_widget_…`, that goes into the page or the app.'
        allowed_origins:
          type: array
          description: 'Widgets only: the pages that may embed it (see `WidgetOriginsRequest`).'
          items: { type: string }

    Channel:
      type: object
      required: [id, type, name, status, error_code, details, last_inbound_at, created_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        type: { $ref: '#/components/schemas/ChannelType' }
        name: { type: string, description: Name in the panel. }
        status: { $ref: '#/components/schemas/ChannelStatus' }
        error_code: { type: [string, 'null'] }
        details: { $ref: '#/components/schemas/ChannelDetails' }
        last_inbound_at:
          type: [string, 'null']
          format: date-time
          description: When a customer message last came in, to the minute; `null` before the first.
        created_at: { type: string, format: date-time }

    ChannelList:
      type: object
      required: [items, telegram_user_available, encryption_available]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        telegram_user_available:
          type: boolean
          description: Personal Telegram accounts can be connected on this server.
        encryption_available:
          type: boolean
          description: '`TOLKOVO_MASTER_KEY` is set; without it nothing can be connected.'

    ConnectTelegramBotRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 100, description: The token from @BotFather. }
        name: { type: string, maxLength: 120 }

    StartTelegramUserLoginRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { type: string, maxLength: 32, description: 'International format, e.g. "+7 900 123-45-67".' }

    TelegramCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, maxLength: 16 }

    TelegramPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, format: password, maxLength: 256 }

    TelegramLogin:
      type: object
      required: [channel, next]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        next:
          type: string
          enum: [code, password, done]
        code_via:
          type: string
          description: Where Telegram sent the code; present after the phone step.
          enum: [app, sms, call, other]

    GitHubIntegrationState:
      type: object
      required: [integration, defaults, placeholders, encryption_available]
      properties:
        integration:
          oneOf:
            - $ref: '#/components/schemas/GitHubIntegration'
            - type: 'null'
        defaults: { $ref: '#/components/schemas/GitHubTemplates' }
        placeholders:
          type: object
          description: What the templates may use, as `{name}`.
          required: [issue, reply]
          properties:
            issue: { type: array, items: { type: string } }
            reply: { type: array, items: { type: string } }
        encryption_available:
          type: boolean
          description: '`false` when `TOLKOVO_MASTER_KEY` is not set: connecting is refused.'

    GitHubIntegration:
      type: object
      required: [id, status, app, install_url, account, repository, labels, templates, custom_templates, created_at, updated_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        status:
          type: string
          enum: [app_pending, install_pending, active]
          description: |
            `app_pending`: waiting for GitHub to create the App; `install_pending`: waiting for the
            installation; `active`: works.
        app:
          description: The App on GitHub; `null` until it is created.
          oneOf:
            - $ref: '#/components/schemas/GitHubApp'
            - type: 'null'
        install_url:
          type: [string, 'null']
          description: Where to install the App, while `install_pending`.
        account: { type: [string, 'null'], description: The account the App is installed on. }
        repository:
          description: Where new issues go; `null` until picked.
          oneOf:
            - $ref: '#/components/schemas/GitHubRepository'
            - type: 'null'
        labels: { type: array, maxItems: 10, items: { type: string } }
        templates: { $ref: '#/components/schemas/GitHubTemplates' }
        custom_templates:
          type: object
          description: Which templates are changed rather than built in.
          required: [issue_title, issue_body, reply_ru, reply_en]
          properties:
            issue_title: { type: boolean }
            issue_body: { type: boolean }
            reply_ru: { type: boolean }
            reply_en: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GitHubApp:
      type: object
      required: [id, slug, owner, url]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, description: 'github.com/apps/<slug>' }
        owner: { type: string, description: The account that owns the App. }
        url: { type: string, description: The App's page on GitHub. }

    GitHubRepository:
      type: object
      required: [id, full_name, private, url]
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string, description: '"owner/name"' }
        private:
          type: boolean
          description: A public repository shows the issue text to everyone; the issue form warns.
        url: { type: string }

    GitHubRepositoryList:
      type: object
      required: [items, more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GitHubRepository' }
        more: { type: boolean, description: There are more than listed. }

    IssueStatus:
      type: string
      enum: [creating, open, closed, failed]
      description: |
        `creating`: GitHub has not created it yet; `open` and `closed` as on GitHub; `failed`:
        GitHub refused it, `error` says why.

    IssueLink:
      type: object
      required: [id, conversation_id, repository, number, url, title, status, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        conversation_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        repository: { type: string, description: '"owner/name"' }
        number: { type: [integer, 'null'], format: int64, description: '`null` until GitHub has created it.' }
        url: { type: [string, 'null'], description: The issue on GitHub; `null` until created. }
        title: { type: string, minLength: 1, maxLength: 256 }
        status: { $ref: '#/components/schemas/IssueStatus' }
        error:
          type: string
          enum: [repository_unreachable, app_refused, rejected, unavailable, disconnected]
          description: |
            Present only with `status: failed`. Why GitHub did not create it: the App lost access to the repository, GitHub
            refused the App, GitHub refused the issue (issues turned off), GitHub did not
            answer through every attempt, or GitHub was disconnected.
        created_by:
          type: [string, 'null']
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConversationIssues:
      type: object
      required: [repository, items, reply_draft]
      properties:
        repository:
          description: Where new issues go; `null` when GitHub is not connected or has no repository.
          oneOf:
            - $ref: '#/components/schemas/GitHubRepository'
            - type: 'null'
        items:
          type: array
          items: { $ref: '#/components/schemas/IssueLink' }
        reply_draft:
          description: |
            The reply about the fix the operator may send, once an issue of the conversation was
            closed as completed; `null` otherwise and after an operator replied to the customer
            since. Tolkovo never sends it itself.
          oneOf:
            - $ref: '#/components/schemas/IssueReplyDraft'
            - type: 'null'

    IssueReplyDraft:
      type: object
      required: [issue_id, number, text]
      properties:
        issue_id:
          type: string
          description: The closed issue link the draft is about.
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        number: { type: integer, format: int64 }
        text:
          type: string
          maxLength: 4000
          description: |
            The workspace's reply template in the contact's language (the workspace's when the
            contact has none), `{name}` and `{issue_number}` filled.

    IssueDraft:
      type: object
      required: [repository, title, body, quote, labels]
      properties:
        repository: { $ref: '#/components/schemas/GitHubRepository' }
        title: { type: string, maxLength: 256 }
        body: { type: string, maxLength: 20000 }
        quote:
          type: string
          maxLength: 4000
          description: The customer's first message; empty when there is none. Off by default for a public repository.
        labels:
          type: array
          maxItems: 10
          items: { type: string }

    CreateIssueRequest:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 256, description: One line. }
        body: { type: string, maxLength: 20000 }
        quote:
          type: string
          maxLength: 4000
          description: The customer's words to send along, as a marked block; empty or left out sends none.
        labels:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 50 }

    LinkIssueRequest:
      type: object
      required: [number]
      additionalProperties: false
      properties:
        number: { type: integer, format: int64, minimum: 1, description: The issue number in the workspace's repository. }

    OpenGitHubIssue:
      type: object
      required: [repository, number, title, url]
      properties:
        repository: { type: string }
        number: { type: integer, format: int64 }
        title: { type: string }
        url: { type: string }

    OpenGitHubIssueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/OpenGitHubIssue' }

    GitHubTemplates:
      type: object
      description: |
        The issue template (title and body) and the reply about a fix in Russian and English,
        with `{name}` placeholders (`placeholders`).
      additionalProperties: false
      required: [issue_title, issue_body, reply_ru, reply_en]
      properties:
        issue_title: { type: string, maxLength: 256 }
        issue_body: { type: string, maxLength: 20000 }
        reply_ru: { type: string, maxLength: 4000 }
        reply_en: { type: string, maxLength: 4000 }

    StartGitHubIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        organization:
          type: string
          maxLength: 39
          description: Create the App in this GitHub organization; the user's account when absent.

    GitHubManifestStart:
      type: object
      required: [integration, post_url, manifest]
      properties:
        integration: { $ref: '#/components/schemas/GitHubIntegration' }
        post_url: { type: string, description: Where the browser posts the form. }
        manifest: { type: string, description: 'The value of the form field `manifest` (JSON).' }

    CompleteGitHubAppRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string, maxLength: 200 }
        state: { type: string, maxLength: 200 }

    CompleteGitHubInstallationRequest:
      type: object
      additionalProperties: false
      required: [installation_id]
      properties:
        installation_id: { type: integer, format: int64, minimum: 1 }

    UpdateGitHubIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        repository: { type: string, maxLength: 200, description: '"owner/name"; empty clears it.' }
        labels: { type: array, maxItems: 10, items: { type: string, maxLength: 50 } }
        templates: { $ref: '#/components/schemas/GitHubTemplates' }

    AppLimits:
      type: object
      description: Limits of an app channel (`details.app_limits`).
      additionalProperties: false
      required: [max_file_mb, max_files, max_report_mb, retention_days, daily_reports, daily_mb]
      properties:
        max_file_mb: { type: integer, minimum: 1, maximum: 25, description: One file in MB. }
        max_files: { type: integer, minimum: 1, maximum: 5, description: Files in one report. }
        max_report_mb: { type: integer, minimum: 1, maximum: 50, description: All files of one report in MB. }
        retention_days: { type: integer, minimum: 1, maximum: 365, description: 'Files are deleted after it; the messages stay.' }
        daily_reports: { type: integer, minimum: 1, maximum: 10000, description: Reports a day for the channel. }
        daily_mb: { type: integer, minimum: 1, maximum: 100000, description: Megabytes of files a day for the channel. }

    ConnectAppChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 120, description: 'Usually the app''s name, e.g. "Зерно для Windows".' }

    IngestKey:
      type: object
      required: [id, name, prefix, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        name: { type: string }
        prefix: { type: string, description: 'The start of the key, e.g. "tk_ingest_Xb3k9Q".' }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    IngestKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IngestKey' }

    CreateIngestKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 120, description: 'Where the key goes, e.g. "Сборка 2.4".' }

    IngestKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: '#/components/schemas/IngestKey' }
        secret:
          type: string
          description: '`tk_ingest_…`, the whole key. The server keeps only its hash.'

    IdentitySecret:
      type: object
      required: [identity_secret]
      properties:
        identity_secret:
          type: string
          description: |
            `tk_identity_…`. Lives only on the company's backend, never in the app: the backend
            signs `identity_token` = HMAC-SHA256(`external_id`, secret), hex.

    AppChannelCreated:
      type: object
      required: [channel, ingest_key, identity_secret]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        ingest_key: { $ref: '#/components/schemas/IngestKeyCreated' }
        identity_secret: { type: string, description: See `IdentitySecret`. }

    IngestReportRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 10000, description: What the user wrote. }
        contact: { $ref: '#/components/schemas/IngestContact' }
        app: { $ref: '#/components/schemas/IngestApp' }
        files:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/IngestFile' }

    IngestContact:
      type: object
      additionalProperties: false
      description: Who the app user says they are. Every field is optional.
      properties:
        external_id: { type: string, maxLength: 255, description: The user's id in the company's system. }
        email: { type: string, maxLength: 254 }
        name: { type: string, maxLength: 120 }
        identity_token:
          type: string
          maxLength: 128
          description: Hex HMAC-SHA256 of `external_id` under the channel's identity secret.

    IngestApp:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        version: { type: string, maxLength: 50 }
        os: { type: string, maxLength: 50 }
        os_version: { type: string, maxLength: 100 }
        locale: { type: string, maxLength: 35 }
        extra:
          type: object
          description: Up to 20 more facts, values up to 500 characters.
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }

    IngestFile:
      type: object
      additionalProperties: false
      required: [name, size, content_type, sha256]
      properties:
        name: { type: string, minLength: 1, maxLength: 1024 }
        size: { type: integer, format: int64, minimum: 1 }
        content_type: { type: string, maxLength: 255 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Hex SHA-256 of the file. }

    IngestReportCreated:
      type: object
      required: [report_id, report_token, contact_verified, uploads]
      properties:
        report_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        report_token: { type: string, description: 'Shown once; send it as `X-Report-Token`.' }
        contact_verified: { type: boolean }
        uploads:
          type: array
          description: One per file, in the order of `files`.
          items: { $ref: '#/components/schemas/IngestUpload' }

    IngestUpload:
      type: object
      required: [name, upload]
      properties:
        name: { type: string }
        upload: { $ref: '#/components/schemas/SignedRequest' }

    IngestReplies:
      type: object
      required: [items, cursor, more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IngestReply' }
        cursor:
          type: string
          description: Send as `since` next time. The same `since` when nothing is new; empty before the first reply.
        more: { type: boolean, description: 'More replies wait: ask again at once.' }

    IngestReply:
      type: object
      required: [id, sender, body, created_at, files]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        sender:
          type: string
          enum: [operator, bot]
          description: Who wrote it, without the name.
        body: { type: string, description: Empty for a reply of files only. }
        created_at: { type: string, format: date-time }
        files:
          type: array
          description: The files of the reply that can be downloaded, in their order.
          items: { $ref: '#/components/schemas/IngestReplyFile' }

    IngestReplyFile:
      type: object
      required: [name, content_type, size, download]
      properties:
        name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        download: { $ref: '#/components/schemas/SignedRequest' }

    IngestMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 10000 }

    IngestMessage:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        created_at: { type: string, format: date-time }

    ConnectWidgetChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 120, description: 'E.g. "Чат в приложении".' }
        allowed_origins:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 255 }
          description: See `WidgetOriginsRequest`.

    WidgetOriginsRequest:
      type: object
      additionalProperties: false
      required: [allowed_origins]
      properties:
        allowed_origins:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 255 }
          description: |
            Up to 20: `https://shop.example.com` (one site; default ports dropped),
            `https://*.example.com` (every subdomain, not the apex), `app://name` (an Electron
            app's custom scheme, registered as standard), `file://` and `null` (an Electron app
            loaded from files — `null` is also what a sandboxed iframe on any site sends, so
            prefer a custom scheme). `*` is refused.

    WidgetChannelCreated:
      type: object
      required: [channel, identity_secret]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        identity_secret:
          type: string
          description: |
            `tk_identity_…`. Lives only on the company's backend, never in the page or the app:
            the backend signs `user_hash` = HMAC-SHA256(`external_id`, secret), hex.

    WidgetSessionRequest:
      type: object
      additionalProperties: false
      required: [widget_key]
      properties:
        widget_key: { type: string, maxLength: 200 }
        session_token: { type: string, maxLength: 200, description: The token the widget kept, if any. }
        user: { $ref: '#/components/schemas/WidgetUser' }

    WidgetUser:
      type: object
      additionalProperties: false
      properties:
        external_id: { type: string, maxLength: 255, description: The user's id in the company's system. }
        user_hash: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }

    WidgetContactRequest:
      type: object
      additionalProperties: false
      description: At least one field.
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        phone:
          type: string
          maxLength: 32
          description: 3–32 digits, spaces, brackets or hyphens, an optional leading `+`.
        consent:
          type: object
          additionalProperties: false
          required: [policy_url]
          description: The visitor ticked the consent shown with a link to this policy.
          properties:
            policy_url: { type: string, format: uri, maxLength: 2048, description: An http(s) URL. }

    WidgetSession:
      type: object
      required: [session_token, expires_at, identity, channel_name]
      properties:
        session_token: { type: string, description: '`tk_wsess_…`; keep it and send it as `Authorization: Bearer`.' }
        expires_at: { type: string, format: date-time, description: 'Moves 30 days ahead with activity.' }
        identity:
          type: string
          enum: [verified, unverified, none]
        channel_name: { type: string }

    WidgetMessages:
      type: object
      required: [items, cursor, more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WidgetMessage' }
        cursor: { type: string, description: Pass as `since` next time. }
        more: { type: boolean, description: More messages follow; ask again at once. }

    WidgetMessage:
      type: object
      required: [id, conversation_id, sender, body, created_at, files]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        conversation_id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        sender:
          type: string
          description: '`contact` — the visitor; `operator` or `bot` — a reply.'
          enum: [contact, operator, bot]
        body: { type: string }
        created_at: { type: string, format: date-time }
        files:
          type: array
          items: { $ref: '#/components/schemas/IngestReplyFile' }

    WidgetMessageRequest:
      type: object
      additionalProperties: false
      description: Text, files or both.
      properties:
        message: { type: string, maxLength: 10000 }
        attachment_ids:
          type: array
          description: Ids of `POST /widget/uploads`, in the order to show.
          maxItems: 5
          items:
            type: string
            x-go-type: uuid.UUID
            x-go-type-import: { path: github.com/google/uuid }

    WidgetUploadRequest:
      type: object
      additionalProperties: false
      required: [file_name, content_type, size]
      properties:
        file_name: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1, maximum: 10485760 }

    WidgetUpload:
      type: object
      required: [id, upload]
      properties:
        id:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        upload: { $ref: '#/components/schemas/SignedRequest' }

    WidgetReceiptRequest:
      type: object
      additionalProperties: false
      properties:
        delivered_up_to:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }
        read_up_to:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import: { path: github.com/google/uuid }

    RenameChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
